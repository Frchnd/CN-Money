    /* Optional master suggestions. Does not change input automatically. */

    /* CN MONEY v2.3.1 — CLEAN UI audit */

    /* CN MONEY v2.3.5 — taxonomy guide + History title fit */
    .tx-title{
      font-size:11.5px!important;
      line-height:1.18!important;

    }
    .category-guide-result b{
      display:block;
      font-size:10.5px;
      line-height:1.2;
      text-transform:uppercase;
    }
    .category-guide-result span{
      display:block;
      margin-top:4px;
      color:var(--muted);

    /* CN MONEY v2.3.6 — clean DATA + LIST filter */
    .list-filter-row{display:flex;gap:7px;margin:10px 0 8px}
    .list-filter-chip{min-height:34px;padding:0 13px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--muted);font-size:9.5px;font-weight:1000;letter-spacing:.035em}
    .list-filter-chip.active{color:var(--primary);border-color:color-mix(in srgb,var(--primary) 45%,var(--line));background:color-mix(in srgb,var(--primary) 12%,var(--surface))}
    .db-compact-list{padding:0!important;overflow:hidden}
    .db-compact-row{width:100%;min-height:48px;display:flex;align-items:center;padding:0 13px;border:0;border-bottom:1px solid var(--line);border-radius:0!important;background:transparent;color:var(--text);text-align:left}
    .db-compact-row:last-child{border-bottom:0}.db-compact-row:active{background:var(--surface2)}
    .db-compact-name{min-width:0;font-size:12.5px;line-height:1.2;font-weight:950;letter-spacing:.01em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .db-group-head{margin:14px 3px 7px;color:var(--muted);font-size:9px;line-height:1.2;font-weight:1000;letter-spacing:.065em;text-transform:uppercase}


    /* CN MONEY v2.3.8 — stable rapid LIST typing */
    .shop-fast-input{
      resize:none!important;
      overflow:hidden!important;
      white-space:nowrap!important;
      line-height:normal!important;
      min-height:0!important;
      height:100%!important;
      font-family:inherit!important;
    }

    /* CN MONEY v2.4.0 — conservative autocorrect / ambiguity */
    .shop-ambiguity{
      margin:7px 0 2px;
      padding:9px 10px;
      border:1px solid var(--line);
      border-radius:14px;
      background:var(--surface2);
    }
    .shop-ambiguity.hidden{display:none}
    .shop-ambiguity-title{
      margin-bottom:7px;
      color:var(--muted);
      font-size:8.5px;
      font-weight:1000;
      letter-spacing:.055em;
      text-transform:uppercase;
    }
    .shop-ambiguity-actions{
      display:flex;
      flex-wrap:wrap;
      gap:6px;
    }
    .shop-ambiguity-choice{
      min-height:32px;
      padding:0 11px;
      border:1px solid var(--line);
      border-radius:999px;
      background:var(--surface);
      color:var(--text);
      font-size:9.5px;
      font-weight:1000;
      text-transform:uppercase;
    }
    .shop-ambiguity-choice.primary{
      border-color:color-mix(in srgb,var(--primary) 48%,var(--line));
      color:var(--primary);
    }


    /* CN MONEY v2.4.15 — DATABASE selection draft + SELECT ALL */
    .brand-block{display:flex;flex-direction:column;align-items:flex-start;min-width:0}
    .app-status{margin-top:4px;display:inline-flex;align-items:center;gap:7px;font-size:9px;font-weight:950;letter-spacing:.11em;color:var(--muted);line-height:1}
    .app-status .dot{width:6px;height:6px;box-shadow:0 0 0 2px rgba(16,185,129,.12)}
    .app-status .dot.offline{box-shadow:0 0 0 2px rgba(245,158,11,.12)}
    .modal-back{font-size:21px!important;font-weight:900!important}



    /* CN MONEY v2.4.18 — DATABASE category/subcategory visibility persistence */
    /* CN MONEY v2.4.17 — DATA detail purchase-history refinement */
    .db-detail-title-wrap .shop-uom-inline{
      display:inline-flex;align-items:center;justify-content:center;
      min-height:20px;padding:3px 7px;border-radius:999px;
      border:1px solid color-mix(in srgb,var(--muted) 36%,var(--line));
      background:color-mix(in srgb,var(--muted) 8%,var(--surface2));
      color:var(--muted);font-size:8px;font-weight:950;letter-spacing:.07em;
    }
    .db-purchase-product{
      margin-bottom:4px;font-size:12px;line-height:1.2;font-weight:1000;
      letter-spacing:.025em;text-transform:uppercase;
    }
    .db-purchase-store{margin-top:0}
    .db-purchase-row-bottom{
      display:grid!important;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);
      align-items:center;gap:8px;
    }
    .db-purchase-row-bottom>span:first-child{text-align:left}
    .db-purchase-row-bottom>span:last-child{text-align:right}
    .db-purchase-row-bottom .db-purchase-date{
      margin:0!important;color:var(--muted)!important;font-size:9.5px!important;
      font-weight:800!important;letter-spacing:0!important;text-align:center;white-space:nowrap;
    }
    .db-history-section .db-purchase-history{
      max-height:min(42dvh,390px)!important;overflow-y:auto!important;
      overscroll-behavior:contain!important;-webkit-overflow-scrolling:touch!important;
      scrollbar-width:none!important;
    }
    .db-history-section .db-purchase-history::-webkit-scrollbar{display:none!important}


    /* CN MONEY v2.5.0 — COLORFUL PROFESSIONAL / ELEVATED INTERACTIVE CARDS
       Visual-only batch. Existing semantic colors (income/expense/transfer, hero,
       warnings, success/error states) are intentionally preserved. */
    :root{
      --cn-cyan:#0891b2;
      --cn-violet:#7c3aed;
      --cn-teal:#0f766e;
      --cn-gold:#d97706;
      --cn-rose:#be185d;
      --cn-sky:#2563eb;
      --cn-lift-shadow:0 12px 28px rgba(15,23,42,.105),0 3px 9px rgba(15,23,42,.045);
      --cn-lift-shadow-strong:0 16px 34px rgba(15,23,42,.14),0 4px 12px rgba(15,23,42,.06);
      --cn-inset-highlight:inset 0 1px 0 rgba(255,255,255,.72);
      --bg:#edf3fa;
      --surface2:#f6f8fc;
    }
    html.dark{
      --cn-cyan:#22d3ee;
      --cn-violet:#a78bfa;
      --cn-teal:#2dd4bf;
      --cn-gold:#fbbf24;
      --cn-rose:#f472b6;
      --cn-sky:#60a5fa;
      --cn-lift-shadow:0 13px 30px rgba(0,0,0,.30),0 3px 10px rgba(0,0,0,.22);
      --cn-lift-shadow-strong:0 18px 38px rgba(0,0,0,.38),0 5px 14px rgba(0,0,0,.24);
      --cn-inset-highlight:inset 0 1px 0 rgba(255,255,255,.055);
      --bg:#060d18;
      --surface:#111b2b;
      --surface2:#0b1422;
      --line:#2a3850;
    }

    /* Give neutral surfaces a very mild tint without replacing existing colors. */
    .app{
      background:
        radial-gradient(circle at 8% 0%,color-mix(in srgb,var(--cn-sky) 5%,transparent),transparent 28%),
        radial-gradient(circle at 96% 28%,color-mix(in srgb,var(--cn-violet) 4%,transparent),transparent 31%),
        var(--surface2);
    }

    /* Shared lift for controls/cards that open another layer. */
    .budget-card.budget-detail-open,
    .db-card-open,
    .receipt-index-card,
    .entity-card,
    .dashboard-month-trigger,
    .receipt-period-trigger,
    .history-top-controls .month-trigger,
    .history-top-controls .picker-trigger,
    .data-filter-chip,
    .list-filter-chip{
      box-shadow:var(--cn-lift-shadow),var(--cn-inset-highlight)!important;
    }

    /* LIST — each tappable item reads as its own raised card. */
    .shop-clean-list.card{
      background:transparent!important;
      border:0!important;
      box-shadow:none!important;
      overflow:visible!important;
    }
    .shop-clean-list .shop-item.clean-list-item{
      margin:0 0 9px!important;
      border:1px solid color-mix(in srgb,var(--cn-cyan) 38%,var(--line))!important;
      border-radius:17px!important;
      background:linear-gradient(145deg,var(--surface),color-mix(in srgb,var(--cn-cyan) 3.2%,var(--surface)))!important;
      box-shadow:var(--cn-lift-shadow),var(--cn-inset-highlight)!important;
      transition:transform .12s ease,box-shadow .16s ease,border-color .16s ease!important;
    }
    .shop-clean-list .shop-item.clean-list-item:last-child{margin-bottom:0!important}
    .shop-clean-list .shop-item.clean-list-item:active{
      transform:translateY(1px) scale(.993);
      box-shadow:0 7px 18px rgba(15,23,42,.09),var(--cn-inset-highlight)!important;
      border-color:color-mix(in srgb,var(--cn-cyan) 58%,var(--line))!important;
    }

    /* DATA — violet outline separates learned item data from shopping LIST. */
    .db-card-open{
      border-color:color-mix(in srgb,var(--cn-violet) 38%,var(--line))!important;
      background:linear-gradient(145deg,var(--surface),color-mix(in srgb,var(--cn-violet) 3.5%,var(--surface)))!important;
    }
    .db-card-open:active{border-color:color-mix(in srgb,var(--cn-violet) 60%,var(--line))!important}

    /* Dashboard budget — warm amber, but existing progress warning/error colors stay unchanged. */
    .budget-card.budget-detail-open{
      border-color:color-mix(in srgb,var(--cn-gold) 40%,var(--line))!important;
      background:linear-gradient(145deg,var(--surface),color-mix(in srgb,var(--cn-gold) 3.5%,var(--surface)))!important;
    }
    .budget-card.budget-detail-open:active{border-color:color-mix(in srgb,var(--cn-gold) 62%,var(--line))!important}

    /* Receipt cards — distinct teal outline. */
    .receipt-index-card{
      border-color:color-mix(in srgb,var(--cn-teal) 40%,var(--line))!important;
      background:linear-gradient(145deg,var(--surface),color-mix(in srgb,var(--cn-teal) 3.5%,var(--surface)))!important;
      transition:transform .12s ease,box-shadow .16s ease,border-color .16s ease!important;
    }
    .receipt-index-card:active{
      transform:translateY(1px) scale(.994);
      border-color:color-mix(in srgb,var(--cn-teal) 62%,var(--line))!important;
    }

    /* Wealth cards get their own outline by tab/context. */
    .entity-card[data-wallet-detail]{
      border-color:color-mix(in srgb,var(--cn-sky) 40%,var(--line))!important;
      background:linear-gradient(145deg,var(--surface),color-mix(in srgb,var(--cn-sky) 3.5%,var(--surface)))!important;
    }
    .entity-card[data-investment-detail]{
      border-color:color-mix(in srgb,var(--cn-violet) 42%,var(--line))!important;
      background:linear-gradient(145deg,var(--surface),color-mix(in srgb,var(--cn-violet) 3.6%,var(--surface)))!important;
    }
    .entity-card[data-asset-detail]{
      border-color:color-mix(in srgb,var(--cn-gold) 42%,var(--line))!important;
      background:linear-gradient(145deg,var(--surface),color-mix(in srgb,var(--cn-gold) 3.6%,var(--surface)))!important;
    }

    /* Month / category filters are buttons, so make the affordance visible. */
    .dashboard-month-trigger,
    .receipt-period-trigger,
    .history-top-controls .month-trigger{
      border-color:color-mix(in srgb,var(--cn-sky) 38%,var(--line))!important;
      background:linear-gradient(145deg,var(--surface),color-mix(in srgb,var(--cn-sky) 4%,var(--surface)))!important;
    }
    .history-top-controls .picker-trigger{
      border-color:color-mix(in srgb,var(--cn-violet) 38%,var(--line))!important;
      background:linear-gradient(145deg,var(--surface),color-mix(in srgb,var(--cn-violet) 4%,var(--surface)))!important;
    }
    .data-filter-chip,
    .list-filter-chip{
      box-shadow:0 6px 15px rgba(15,23,42,.07),var(--cn-inset-highlight)!important;
    }

    /* Primary + buttons keep their approved color; only depth/outline is strengthened. */
    .fab,
    .add-only{
      border:1px solid rgba(255,255,255,.24)!important;
      box-shadow:0 18px 38px rgba(79,70,229,.34),0 5px 14px rgba(15,23,42,.16),inset 0 1px 0 rgba(255,255,255,.24)!important;
      transition:transform .12s ease,box-shadow .16s ease!important;
    }
    .fab:active,
    .add-only:active{
      transform:translateY(2px) scale(.97)!important;
      box-shadow:0 10px 22px rgba(79,70,229,.28),0 3px 8px rgba(15,23,42,.12),inset 0 1px 0 rgba(255,255,255,.18)!important;
    }

    /* Neutral cards that are not semantic get a little depth, not extra saturation. */
    .wealth-safe-total,
    .wealth-mini,
    .cashflow-chart,
    .shopping-add{
      box-shadow:0 9px 23px rgba(15,23,42,.065),var(--cn-inset-highlight)!important;
    }

    html.dark .shop-clean-list .shop-item.clean-list-item:active,
    html.dark .receipt-index-card:active{
      box-shadow:0 8px 19px rgba(0,0,0,.28),var(--cn-inset-highlight)!important;
    }
    html.dark .data-filter-chip,
    html.dark .list-filter-chip{
      box-shadow:0 7px 16px rgba(0,0,0,.22),var(--cn-inset-highlight)!important;
    }

    @media(prefers-reduced-motion:reduce){
      .shop-clean-list .shop-item.clean-list-item,
      .receipt-index-card,
      .fab,.add-only{transition:none!important}
    }


    /* v2.6.2 — receipt UX uses normal app typography; thermal style is PDF-only */
    .receipt-custom-toolbar{display:flex;gap:7px;align-items:center;justify-content:space-between;margin:10px 0 8px}
    .receipt-custom-toolbar .btn{min-height:34px;padding:8px 11px;font-size:9px}
    .receipt-filter-overview{display:grid;grid-template-columns:1fr;gap:0;margin:0 0 11px;border:1px solid var(--line);border-radius:17px;background:var(--surface);overflow:hidden;box-shadow:0 7px 18px rgba(15,23,42,.07)}
    .receipt-filter-overview-row{display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line)}
    .receipt-filter-overview-row:last-child{border-bottom:0}
    .receipt-filter-overview-row span{font-size:8px;font-weight:950;letter-spacing:.07em;color:var(--muted);text-transform:uppercase}
    .receipt-filter-overview-row b{font-size:10px;font-weight:950;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right;color:var(--text)}
    .receipt-custom-card{overflow:visible;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:normal}
    .receipt-custom-card .receipt-store,.receipt-custom-card .receipt-total,.receipt-custom-card .receipt-line{font-family:inherit;letter-spacing:normal}
    .receipt-custom-card .receipt-items{border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
    .receipt-custom-scroll{max-height:none;overflow:visible;padding-right:0}

  for(let i=1;i<=n;i++)for(let j=1;j<=m;j++){

    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+cost);

function receiptPdfSafeText(value){
  return String(value??'')
    .normalize('NFKD')
    .replace(/[\u0300-\u036f]/g,'')
    .replace(/[–—]/g,'-')
    .replace(/[“”]/g,'"')
    .replace(/[‘’]/g,"'")
    .replace(/[^\x20-\x7E]/g,'?')
}
function receiptPdfEscape(value){
  return receiptPdfSafeText(value).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)')
}
function receiptPdfWrap(value,maxChars=36){
  const text=receiptPdfSafeText(value).trim();
  if(!text)return[''];
  const words=text.split(/\s+/),lines=[];
  let line='';
  for(const word of words){
    if(word.length>maxChars){
      if(line){lines.push(line);line=''}
      for(let i=0;i<word.length;i+=maxChars)lines.push(word.slice(i,i+maxChars))
      continue
    }
    const next=line?line+' '+word:word;
    if(next.length>maxChars){if(line)lines.push(line);line=word}else line=next
  }
  if(line)lines.push(line);
  return lines.length?lines:[''];
}
function receiptPdfMoney(value){
  const n=Math.round(Number(value)||0);
  return 'Rp '+new Intl.NumberFormat('id-ID',{maximumFractionDigits:0}).format(n)
}
function receiptPdfDate(value){
  const raw=String(value||today());
  const d=new Date(raw+'T00:00:00');
  if(Number.isNaN(d.getTime()))return raw;
  return new Intl.DateTimeFormat('id-ID',{day:'2-digit',month:'2-digit',year:'numeric'}).format(d)
}
function receiptPdfFilename(session){
  const date=String(session?.checkout_date||today()).slice(0,10);
  return `CN-MONEY-Receipt-${date}.pdf`
}
function buildReceiptPdfVectorFallback(session,items,walletName){
  const pageW=226.7717,margin=13,font=8.2,lineH=11.2,maxChars=39;
  const rows=[];
  const push=(text,opt={})=>rows.push({text:receiptPdfSafeText(text),...opt});
  const rule=()=>rows.push({rule:true});
  const pair=(left,right,opt={})=>rows.push({left:receiptPdfSafeText(left),right:receiptPdfSafeText(right),...opt});

  push('CN MONEY',{align:'center',bold:true,size:11});
  push('RECEIPT',{align:'center',bold:true,size:9});
  rule();
  for(const line of receiptPdfWrap(session?.store_name||'BELANJA BULANAN',maxChars))push(line,{bold:true});
  pair('TANGGAL',receiptPdfDate(session?.checkout_date));
  pair('DOMPET',walletName||'DOMPET');
  rule();

  const safeItems=Array.isArray(items)?items:[];
  safeItems.forEach((item,idx)=>{
    receiptPdfWrap(String(item?.item_name||'BARANG').toUpperCase(),maxChars).forEach((line,i)=>push(line,{bold:i===0}));
    const qty=Number(item?.quantity||0);
    const uom=receiptPdfSafeText(item?.uom||'Pcs');
    const unit=Number(item?.unit_price||0);
    const subtotal=Number(item?.subtotal||qty*unit||0);
    pair(`${qty} ${uom} x ${receiptPdfMoney(unit)}`,receiptPdfMoney(subtotal));
    if(idx<safeItems.length-1)push('');
  });

  rule();
  pair('TOTAL',receiptPdfMoney(session?.total_amount||0),{bold:true,size:10});
  rule();
  push(`${safeItems.length} ITEM`,{align:'center'});
  push('CN MONEY',{align:'center',bold:true});
  push('Terima kasih',{align:'center'});

  const top=16,bottom=17;
  const pageH=Math.max(170,top+bottom+rows.length*lineH);
  let y=pageH-top;
  const commands=[];
  const textWidth=(txt,size)=>receiptPdfSafeText(txt).length*size*0.6;
  const textCmd=(txt,x,yy,size=font,isBold=false)=>{
    commands.push(`BT /${isBold?'F2':'F1'} ${size.toFixed(2)} Tf 1 0 0 1 ${x.toFixed(2)} ${yy.toFixed(2)} Tm (${receiptPdfEscape(txt)}) Tj ET`)
  };

  for(const row of rows){
    if(row.rule){
      const yy=y+3;
      commands.push(`[2 2] 0 d 0.55 w ${margin.toFixed(2)} ${yy.toFixed(2)} m ${(pageW-margin).toFixed(2)} ${yy.toFixed(2)} l S [] 0 d`);
      y-=lineH;
      continue;
    }
    const size=Number(row.size||font);
    if(Object.prototype.hasOwnProperty.call(row,'left')){
      const left=row.left||'',right=row.right||'';
      textCmd(left,margin,y,size,!!row.bold);
      textCmd(right,Math.max(margin,pageW-margin-textWidth(right,size)),y,size,!!row.bold);
      y-=lineH;
      continue;
    }
    const txt=row.text||'';
    let x=margin;
    if(row.align==='center')x=Math.max(margin,(pageW-textWidth(txt,size))/2);
    else if(row.align==='right')x=Math.max(margin,pageW-margin-textWidth(txt,size));
    textCmd(txt,x,y,size,!!row.bold);
    y-=lineH;
  }

  const stream=commands.join('\n')+'\n';
  const objects=[
    '<< /Type /Catalog /Pages 2 0 R >>',
    '<< /Type /Pages /Kids [3 0 R] /Count 1 >>',
    `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pageW.toFixed(2)} ${pageH.toFixed(2)}] /Resources << /Font << /F1 4 0 R /F2 5 0 R >> >> /Contents 6 0 R >>`,
    '<< /Type /Font /Subtype /Type1 /BaseFont /Courier /Encoding /WinAnsiEncoding >>',
    '<< /Type /Font /Subtype /Type1 /BaseFont /Courier-Bold /Encoding /WinAnsiEncoding >>',
    `<< /Length ${stream.length} >>\nstream\n${stream}endstream`
  ];

  let pdf='%PDF-1.4\n%CNMONEY\n';
  const offsets=[0];
  objects.forEach((obj,i)=>{
    offsets[i+1]=pdf.length;
    pdf+=`${i+1} 0 obj\n${obj}\nendobj\n`;
  });
  const xref=pdf.length;
  pdf+=`xref\n0 ${objects.length+1}\n0000000000 65535 f \n`;
  for(let i=1;i<=objects.length;i++)pdf+=String(offsets[i]).padStart(10,'0')+' 00000 n \n';
  pdf+=`trailer\n<< /Size ${objects.length+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`;
  return new TextEncoder().encode(pdf)
}
function receiptPdfAsciiBytes(value){return new TextEncoder().encode(String(value??''))}
function receiptPdfConcatBytes(parts){
  const total=parts.reduce((sum,p)=>sum+p.length,0),out=new Uint8Array(total);
  let offset=0;
  for(const part of parts){out.set(part,offset);offset+=part.length}

}
function receiptPdfJpegBytes(dataUrl){
  const base64=String(dataUrl||'').split(',')[1]||'';
  const raw=atob(base64),out=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++)out[i]=raw.charCodeAt(i)&255;
  return out
}
function receiptPdfImageDocument(jpegBytes,pixelW,pixelH){
  const pageW=226.7717,pageH=Math.max(120,pageW*(Number(pixelH)||1)/(Number(pixelW)||1));
  const parts=[],offsets=[0];

  const add=bytes=>{parts.push(bytes);byteLength+=bytes.length};
  const ascii=value=>receiptPdfAsciiBytes(value);
  add(ascii('%PDF-1.4\n%CNMONEY-THERMAL\n'));
  const addObj=(num,bodyParts)=>{
    offsets[num]=byteLength;
    add(ascii(`${num} 0 obj\n`));
    for(const part of bodyParts)add(typeof part==='string'?ascii(part):part);
    add(ascii('\nendobj\n'));
  };
  addObj(1,['<< /Type /Catalog /Pages 2 0 R >>']);
  addObj(2,['<< /Type /Pages /Kids [3 0 R] /Count 1 >>']);
  addObj(3,[`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pageW.toFixed(2)} ${pageH.toFixed(2)}] /Resources << /ProcSet [/PDF /ImageC] /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`]);
  addObj(4,[`<< /Type /XObject /Subtype /Image /Width ${Math.round(pixelW)} /Height ${Math.round(pixelH)} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpegBytes.length} >>\nstream\n`,jpegBytes,'\nendstream']);
  const content=`q\n${pageW.toFixed(2)} 0 0 ${pageH.toFixed(2)} 0 0 cm\n/Im0 Do\nQ\n`,contentBytes=ascii(content);
  addObj(5,[`<< /Length ${contentBytes.length} >>\nstream\n`,contentBytes,'endstream']);
  const xref=byteLength;
  let table=`xref\n0 6\n0000000000 65535 f \n`;
  for(let i=1;i<=5;i++)table+=String(offsets[i]||0).padStart(10,'0')+' 00000 n \n';
  table+=`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`;
  add(ascii(table));
  return receiptPdfConcatBytes(parts)
}

function buildReceiptPdf(session,items,walletName){

    const width=756,margin=43,lineH=37,top=48,bottom=54,rows=receiptPdfCanvasRows(session,items,walletName);
    const height=Math.max(560,top+bottom+rows.length*lineH);

    const ctx=canvas.getContext('2d');

    const fontStack='ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace';

      if(Object.prototype.hasOwnProperty.call(row,'left')){
        drawText(row.left||'',margin,y,size,!!row.bold,'left');
        drawText(row.right||'',width-margin,y,size,!!row.bold,'right');
      }else{
        const align=row.align==='center'?'center':row.align==='right'?'right':'left',x=align==='center'?width/2:align==='right'?width-margin:margin;

    }

  }
}

const addShop=async({keepFocus=false,resolvedName=null,originalRaw=null,skipResolve=false}={})=>{
  const input=document.getElementById('shopInput');
  const typed=String(originalRaw??input?.value??'').trim();
  if(!typed)return;

  if(!skipResolve)await warmShoppingAutocorrect(260);

  const resolved=skipResolve
    ?{name:normalizeItemName(resolvedName||typed),source:'choice'}
    :resolveShoppingInput(typed);

  if(resolved.ambiguity?.length){
    showShopAmbiguity(typed,resolved.ambiguity,keepFocus);
    if(keepFocus&&input){
      try{input.focus({preventScroll:true})}catch(_){input.focus()}
    }
    return;
  }

  const finalName=normalizeItemName(resolved.name||typed);
  if(!finalName)return;
  const hiddenReason=catalogKnownHiddenReason(finalName)||catalogKnownHiddenReason(typed);
  if(hiddenReason){
    clearShopAmbiguity();
    toast(hiddenReason);
    if(keepFocus&&input){try{input.focus({preventScroll:true})}catch(_){input.focus()}}
    return;
  }

  clearShopAmbiguity();

  const rec=smartItem(finalName),item={
    id:makeId(),
    originalInput:typed,
    correctedFrom:resolved.correctedFrom||null,
    name:rec.name,
    normalized:normalizeItemName(rec.name).toLocaleLowerCase('id-ID'),
    category:rec.category,
    priority:rec.priority,
    uom:rec.uom,
    addedAt:new Date().toISOString(),
    purchased:false
  };

  state.checklist=[item,...state.checklist];
  persistCaches();
  playShopClick();

  if(input){input.value='';input.scrollTop=0}
  refreshShopListLive();

  if(keepFocus&&input){
    try{input.focus({preventScroll:true})}catch(_){input.focus()}
  }

  if(resolved.correctedFrom&&shoppingAutocorrectKey(resolved.correctedFrom)!==shoppingAutocorrectKey(rec.name)){
    toast(`${resolved.correctedFrom.toUpperCase()} → ${String(rec.name).toUpperCase()}`);
  }

  const synced=await commitBucketMutation({bucket:'checklist',action:'upsert_id',item});
  if(synced)queueShoppingPush(rec.name);
  else toast('Item tersimpan lokal. Akan sync otomatis saat koneksi pulih.');
};

async function handleCheckoutSubmit(e){
  e.preventDefault();
  if(state.loading||!state.online)return;
  const item=state.checklist.find(x=>String(x.id)===e.currentTarget.dataset.itemid);
  if(!item)return;

  const familyMatch=itemDbMatch(item.name),smart=smartItem(item.name);
  const familyName=normalizeItemName(familyMatch?.entry?.name||smart.name||item.name);
  const familyNorm=familyName.toLocaleLowerCase('id-ID');
  const sourceKey=familyMatch?.key||item.normalized||familyNorm;
  const familyDb=familyMatch?.entry||state.itemDb[sourceKey]||{};
  const productName=normalizeItemName(document.getElementById('checkoutProductName')?.value||familyName)||familyName;
  const productNorm=productName.toLocaleLowerCase('id-ID');

  const qty=Math.max(.01,parseFloat(document.getElementById('checkoutQty').value)||1),
    uom=normalizeUom(document.getElementById('checkoutUom').value||'PCS'),
    price=num(document.getElementById('checkoutPrice').value),
    store=normalizeStoreName(document.getElementById('checkoutStore').value),
    wallet=document.getElementById('checkoutWallet').value,
    total=Math.round(qty*price);

  if(price<=0)return toast('Harga wajib diisi.');
  if(!wallet)return toast('Pilih dompet.');

  const clientId=item.clientCheckoutId||makeId();
  if(!item.clientCheckoutId){
    state.checklist=state.checklist.map(x=>String(x.id)===String(item.id)?{...x,clientCheckoutId:clientId}:x);
    persistCaches();
  }

  state.loading=true;
  const {data,error}=await sb.rpc('finance_complete_checkout_v2',{
    p_household_id:state.household.id,
    p_wallet_id:wallet,
    p_total_amount:total,
    p_items:[{name:productName,quantity:qty,uom,unit_price:price,subtotal:total}],
    p_client_checkout_id:clientId,
    p_store_name:store||null,
    p_checkout_date:today()
  });

  if(error){
    state.loading=false;
    console.error(error);
    return toast(error.message||'Checkout gagal.');
  }

  const row=Array.isArray(data)?data[0]:data,
    sessionId=row?.session_id||null,
    now=new Date().toISOString(),
    cat=shoppingCategoryFor(familyName,item.category);

  state.checklist=state.checklist.map(x=>String(x.id)===String(item.id)?{
    ...x,
    name:familyName,
    normalized:familyNorm,
    category:cat,
    purchased:true,
    purchasedAt:now,
    shoppingSessionId:sessionId,
    clientCheckoutId:clientId
  }:x);

  const variants=familyDb.variants&&typeof familyDb.variants==='object'?{...familyDb.variants}:{};
  if(productNorm!==familyNorm){
    variants[productNorm]={
      ...(variants[productNorm]||{}),
      name:productName,
      lastPrice:price,
      lastStore:store,
      uom,
      lastPurchased:now
    };
  }

  const nextDb={...state.itemDb};
  if(sourceKey!==familyNorm)delete nextDb[sourceKey];
  nextDb[familyNorm]={
    ...familyDb,
    name:familyName,
    normalized:familyNorm,
    category:cat,
    lastPrice:price,
    lastVariantName:productName,
    lastStore:store,
    uom,
    lastPurchased:now,
    variants
  };
  state.itemDb=nextDb;

  const historyRow={
    id:makeId(),
    date:now,
    justDate:today(),
    itemId:familyNorm,
    familyName,
    name:productName,
    category:cat,
    qty,uom,price,total,store,
    shoppingSessionId:sessionId,
    clientCheckoutId:clientId
  };
  state.legacyHistory=[historyRow,...state.legacyHistory];

  const checkoutChecklistItem=state.checklist.find(x=>String(x.id)===String(item.id));
  const bucketMutations=[];
  if(checkoutChecklistItem)bucketMutations.push({bucket:'checklist',action:'upsert_id',item:checkoutChecklistItem});
  if(sourceKey!==familyNorm)bucketMutations.push({bucket:'database',action:'delete_key',key:sourceKey});
  bucketMutations.push({bucket:'database',action:'set_key',key:familyNorm,item:state.itemDb[familyNorm]});
  bucketMutations.push({bucket:'history',action:'upsert_id',item:historyRow});
  const synced=await commitBucketMutations(bucketMutations);
  if(!synced)toast('Transaksi tercatat. Data belanja akan sync otomatis saat koneksi pulih.');

  state.loading=false;
  state.modal=null;
  localStorage.setItem('cn_last_checkout_wallet',wallet);
  persistCaches();
  await loadAll({rerender:false,preserveCacheOnEmpty:true});
  render();
  playCashRegister();
  toast(`Checkout ${rupiah(total)} berhasil.`);
}

function rebuildItemDbAfterCancelledCheckout(cancelledSessionId){
  const activeSessions=new Map(
    (state.shoppingSessions||[])
      .filter(s=>String(s.id)!==String(cancelledSessionId))
      .map(s=>[String(s.id),s])
  );

  const next={...state.itemDb};

  for(const [key,rawDb] of Object.entries(next)){
    const db={...rawDb};
    const familyName=normalizeItemName(db.name||key)||String(db.name||key);
    const familyNorm=familyName.toLocaleLowerCase('id-ID');

    const matchNames=new Set([
      familyNorm,
      ...(Array.isArray(db.aliases)?db.aliases:[])
        .map(x=>normalizeItemName(x).toLocaleLowerCase('id-ID')),
      ...Object.values(db.variants&&typeof db.variants==='object'?db.variants:{})
        .map(v=>normalizeItemName(v?.name||'').toLocaleLowerCase('id-ID'))
    ].filter(Boolean));

    const purchases=(state.shoppingItems||[])
      .map(item=>{
        const session=activeSessions.get(String(item.session_id));
        if(!session)return null;

        const productName=normalizeItemName(item.item_name||'');
        const productNorm=productName.toLocaleLowerCase('id-ID');
        if(!matchNames.has(productNorm))return null;

        return{
          item,
          session,
          productName,
          productNorm,
          stamp:new Date(session.created_at||session.checkout_date||item.created_at||0).getTime()||0
        };
      })
      .filter(Boolean)
      .sort((a,b)=>b.stamp-a.stamp);

    const variants={};
    for(const p of purchases){
      if(p.productNorm===familyNorm)continue;
      if(variants[p.productNorm])continue;
      variants[p.productNorm]={
        name:p.productName,
        lastPrice:Number(p.item.unit_price||0),
        lastStore:normalizeStoreName(p.session.store_name||''),
        uom:normalizeUom(p.item.uom||db.uom||'PCS'),
        lastPurchased:p.session.created_at||p.session.checkout_date||p.item.created_at||null
      };
    }

    if(purchases.length){
      const latest=purchases[0];
      db.lastPrice=Number(latest.item.unit_price||0);
      db.lastStore=normalizeStoreName(latest.session.store_name||'');
      db.lastPurchased=latest.session.created_at||latest.session.checkout_date||latest.item.created_at||null;
      db.lastVariantName=latest.productName||familyName;
    }else{
      db.lastPrice=0;
      db.lastStore='';
      db.lastPurchased=null;
      db.lastVariantName=familyName;
    }

    db.variants=variants;
    next[key]=db;
  }

  state.itemDb=next;
  return next;
}

async function finalizeCancelledCheckoutLocal(sessionId,{silent=false}={}){
  const restoredChecklistItems=[];
  state.checklist=state.checklist.map(x=>{
    if(String(x.shoppingSessionId||'')!==String(sessionId))return x;
    const restored={...x,purchased:false,purchasedAt:null,shoppingSessionId:null,clientCheckoutId:null};
    restoredChecklistItems.push(restored);
    return restored;
  });
  state.legacyHistory=state.legacyHistory.filter(x=>String(x.shoppingSessionId||'')!==String(sessionId));
  persistCaches();
  const cancelMutations=[...restoredChecklistItems.map(item=>({bucket:'checklist',action:'upsert_id',item})),{bucket:'history',action:'delete_session',sessionId}];
  const cancelSynced=await commitBucketMutations(cancelMutations);
  const dbBefore={...state.itemDb};
  rebuildItemDbAfterCancelledCheckout(sessionId);
  const dbMutations=[];
  const keys=new Set([...Object.keys(dbBefore),...Object.keys(state.itemDb)]);
  for(const key of keys){
    if(!(key in state.itemDb))dbMutations.push({bucket:'database',action:'delete_key',key});
    else if(!(key in dbBefore)||JSON.stringify(dbBefore[key])!==JSON.stringify(state.itemDb[key]))dbMutations.push({bucket:'database',action:'set_key',key,item:state.itemDb[key]});
  }
  const dbSynced=await commitBucketMutations(dbMutations);
  persistCaches();
  if(!silent&&(!cancelSynced||!dbSynced))toast('Checkout dibatalkan. Cleanup lokal akan sync otomatis.');
  return cancelSynced&&dbSynced;
}

async function resumePendingCheckoutCancels({silent=true}={}){
  if(!state.online||!state.household?.id)return false;
  const rows=readPendingCheckoutCancels();
  if(!rows.length)return true;
  for(const row of rows){
    const sessionId=String(row.sessionId||'');
    if(!sessionId)continue;
    let active=state.shoppingSessions.some(x=>String(x.id)===sessionId);
    if(active){
      const {error}=await sb.rpc('finance_cancel_checkout',{p_household_id:state.household.id,p_session_id:sessionId});
      if(error){
        if(retryableFinanceError(error))return false;
        try{await loadAll({rerender:false,preserveCacheOnEmpty:true})}catch{}
        active=state.shoppingSessions.some(x=>String(x.id)===sessionId);
        if(active){dropCheckoutCancel(sessionId);if(!silent)toast(error.message||'Gagal membatalkan checkout.');continue}
      }else{
        try{await loadAll({rerender:false,preserveCacheOnEmpty:true})}catch{return false}
      }
    }
    await finalizeCancelledCheckoutLocal(sessionId,{silent:true});
    dropCheckoutCancel(sessionId);
  }
  if(!silent)render();
  return readPendingCheckoutCancels().length===0;
}

async function handleCancelCheckout(sessionId,confirmed=false){
  if(state.loading)return;
  if(!state.online)return toast('Internet diperlukan.');
  const sess=state.shoppingSessions.find(x=>String(x.id)===String(sessionId));
  if(!sess&&!readPendingCheckoutCancels().some(x=>String(x.sessionId)===String(sessionId)))return;
  if(!confirmed){
    askConfirm('cancelCheckout',sessionId,'Batalkan checkout?',`${rupiah(sess?.total_amount||0)} akan dibatalkan. Saldo, anggaran, Receipt, dan data pembelian akan dikembalikan.`,'BATALKAN CHECKOUT');
    return;
  }
  state.loading=true;
  queueCheckoutCancel(sessionId);
  const {error}=await sb.rpc('finance_cancel_checkout',{p_household_id:state.household.id,p_session_id:sessionId});
  if(error){
    state.loading=false;
    if(retryableFinanceError(error)){render();return toast('Koneksi terputus. Pembatalan checkout diamankan dan akan dilanjutkan otomatis.')}
    dropCheckoutCancel(sessionId);render();return toast(error.message||'Gagal membatalkan checkout.');
  }
  try{
    await loadAll({rerender:false,preserveCacheOnEmpty:true});
    await finalizeCancelledCheckoutLocal(sessionId,{silent:true});
    dropCheckoutCancel(sessionId);
  }catch(e){
    console.error('Cancel checkout finalize',e);state.loading=false;render();return toast('Checkout sudah diproses. Finalisasi lokal akan dilanjutkan otomatis saat koneksi stabil.');
  }
  state.loading=false;playDeleteUndo();render();toast('Checkout dibatalkan. Saldo & data pembelian dipulihkan.');
}

async function handleShopCategorySubmit(e){
  e.preventDefault();
  if(state.loading||!state.online)return;

  const itemId=e.currentTarget.dataset.itemid;
  const oldName=String(e.currentTarget.dataset.name||'').trim();
  const newName=shoppingMasterCanonicalName(normalizeItemName(document.getElementById('shopProfileName')?.value||oldName));
  const categoryKey=String(document.getElementById('shopMasterCategory')?.value||'');
  const categoryChoice=document.getElementById('shopCategorySelect').value;
  const priority=normalizeShoppingPriority(document.getElementById('shopPriorityValue')?.value||'');
  const uom=normalizeUom(document.getElementById('shopCategoryUom').value||'PCS');

  if(!newName)return toast('NAMA BARANG WAJIB DIISI.');
  if(!categoryKey)return toast('PILIH KATEGORI.');
  if(!categoryChoice)return toast('PILIH SUB KATEGORI.');
  if(!priority)return toast('PILIH PRIORITAS.');

  const categoryRow=(state.catalog?.categories||[]).find(x=>String(x.category_key)===categoryKey);
  const {subMaster,profileRow:subCategoryRow}=resolveShoppingSubcategoryChoice(categoryKey,categoryChoice);
  if(!categoryRow||!subMaster)return toast('KATEGORI TIDAK VALID.');

  const oldNorm=normalizeItemName(oldName).toLocaleLowerCase('id-ID');
  const newNorm=normalizeItemName(newName).toLocaleLowerCase('id-ID');
  const sourceMatch=itemDbMatch(oldName);
  const existingMatch=itemDbMatch(newName);

  if(newNorm!==oldNorm&&existingMatch&&sourceMatch&&existingMatch.key!==sourceMatch.key){
    return toast('NAMA BARANG SUDAH DIPAKAI DATA LAIN.');
  }
  if(newNorm!==oldNorm&&!sourceMatch&&state.itemDb[newNorm]){
    return toast('NAMA BARANG SUDAH ADA DI DATA.');
  }
  if(newNorm!==oldNorm&&state.checklist.some(x=>
    String(x.id)!==String(itemId||'') &&
    normalizeItemName(x.name).toLocaleLowerCase('id-ID')===newNorm
  ))return toast('NAMA BARANG SUDAH ADA DI LIST.');

  state.loading=true;

  // Existing Supabase profile rows are still updated when the selected
  // subcategory has a legacy shopping_category id. Synthetic "Lainnya"
  // rows are persisted through the synced household database override,
  // so no Supabase schema migration is required for v2.4.16.
  if(subCategoryRow){
    const profileRes=await sb.rpc('shopping_set_item_profile',{p_household_id:state.household.id,p_item_name:newName,p_category_id:subCategoryRow.id,p_preferred_uom:uom});
    if(profileRes.error){state.loading=false;return toast(profileRes.error.message||'GAGAL MENYIMPAN PROFIL BARANG.')}
    const priorityRes=await sb.rpc('shopping_set_item_priority',{p_household_id:state.household.id,p_item_name:newName,p_priority:priority});
    if(priorityRes.error){state.loading=false;return toast(priorityRes.error.message||'GAGAL MENYIMPAN PRIORITAS.')}
  }

  if(newNorm!==oldNorm){
    const del=await sb.rpc('shopping_delete_item_profile',{
      p_household_id:state.household.id,
      p_item_name:oldName
    });
    if(del.error)console.warn('Old profile cleanup',del.error);
  }

  const sourceKey=sourceMatch?.key||
    (shopEditReturnKey&&state.itemDb[shopEditReturnKey]?shopEditReturnKey:null)||
    oldNorm;

  const oldDb=sourceMatch?.entry||state.itemDb[sourceKey]||{};
  const aliases=[
    ...(Array.isArray(oldDb.aliases)?oldDb.aliases:[]),
    ...(newNorm!==oldNorm?[oldName]:[])
  ].map(x=>String(x||'').trim()).filter(Boolean);

  const uniqueAliases=[...new Set(
    aliases.filter(x=>normalizeItemName(x).toLocaleLowerCase('id-ID')!==newNorm)
  )];

  const next={...state.itemDb};
  if(sourceKey!==newNorm)delete next[sourceKey];
  if(oldNorm!==newNorm)delete next[oldNorm];

  next[newNorm]={
    ...oldDb,
    name:newName,
    normalized:newNorm,
    aliases:uniqueAliases,
    category:subMaster.name,
    categoryKey:categoryKey,
    categoryName:categoryRow.name,
    subcategoryKey:subMaster.subcategory_key,
    subcategoryName:subMaster.name,
    priority,
    uom,
    dbOverride:true,
    taxonomyVersion:CN_SHOPPING_TAXONOMY_VERSION,
    updatedAt:new Date().toISOString()
  };
  state.itemDb=next;

  state.checklist=state.checklist.map(x=>{
    const matches=String(x.id)===String(itemId||'')||
      (!itemId&&(
        normalizeItemName(x.name).toLocaleLowerCase('id-ID')===oldNorm ||
        itemDbMatch(x.name)?.key===sourceKey
      ));
    return matches?{
      ...x,
      name:newName,
      normalized:newNorm,
      category:subMaster.name,
      priority,
      uom
    }:x;
  });

  const editMutations=[];
  if(sourceKey!==newNorm)editMutations.push({bucket:'database',action:'delete_key',key:sourceKey});
  if(oldNorm!==newNorm&&oldNorm!==sourceKey)editMutations.push({bucket:'database',action:'delete_key',key:oldNorm});
  editMutations.push({bucket:'database',action:'set_key',key:newNorm,item:state.itemDb[newNorm]});
  for(const row of state.checklist){
    if(String(row.id)===String(itemId||'')||normalizeItemName(row.name).toLocaleLowerCase('id-ID')===newNorm){
      editMutations.push({bucket:'checklist',action:'upsert_id',item:row});
    }
  }
  const editSynced=await commitBucketMutations(editMutations);
  if(!editSynced)toast('Edit tersimpan lokal. Akan sync otomatis saat koneksi pulih.');

  const returnKey=shopEditReturnKey?newNorm:null;
  shopEditReturnKey=null;
  state.modal=null;
  state.loading=false;

  await loadAll({rerender:false,preserveCacheOnEmpty:true});
  if(returnKey&&state.itemDb[returnKey]){
    state.modal='dbdetail:'+encodeURIComponent(returnKey);
  }
  render();
  toast('DATABASE BARANG DIPERBARUI.');
}

function downloadBackupPayload(payload,filename=`CN-MONEY-backup-${today()}.cnmoney`){const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/octet-stream'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),800)}
function backupDataArrays(payload){return payload?.data&&typeof payload.data==='object'?payload.data:null}
function backupSummary(payload){const d=backupDataArrays(payload)||{};return{wallets:Array.isArray(d.wallets)?d.wallets.length:0,transactions:Array.isArray(d.transactions)?d.transactions.length:0,investments:Array.isArray(d.investments)?d.investments.length:0,assets:Array.isArray(d.assets)?d.assets.length:0,shoppingSessions:Array.isArray(d.shopping_sessions)?d.shopping_sessions.length:0,shoppingItems:Array.isArray(d.shopping_session_items)?d.shopping_session_items.length:0}}
function validateBackupPayload(payload){if(!payload||typeof payload!=='object')throw new Error('FILE BACKUP TIDAK VALID.');if(payload.app!=='CN MONEY'||payload.backup_format!=='CNMONEY_FULL_BACKUP'||Number(payload.schema_version)!==1)throw new Error('FORMAT BACKUP TIDAK DIDUKUNG.');if(!state.household?.id||String(payload.household?.id||'')!==String(state.household.id))throw new Error('BACKUP INI BUKAN DARI HOUSEHOLD YANG SAMA.');const d=backupDataArrays(payload),required=['wallets','categories','transactions','investments','assets','monthly_budgets','household_data','shopping_sessions','shopping_session_items','shopping_categories','shopping_item_profiles'];if(!d)throw new Error('ISI BACKUP TIDAK LENGKAP.');for(const key of required)if(!Array.isArray(d[key]))throw new Error('ISI BACKUP TIDAK LENGKAP.');return payload}
function backupDateTime(raw){try{return new Intl.DateTimeFormat('id-ID',{dateStyle:'medium',timeStyle:'short'}).format(new Date(raw))}catch{return String(raw||'-')}}
async function backupData(){if(!state.household?.id)return;if(!state.online)return toast('INTERNET DIPERLUKAN UNTUK BACKUP PENUH.');const btn=document.getElementById('backupBtn');if(btn)btn.disabled=true;try{await flushPendingFinanceOps();if(readPendingFinanceOps().length)throw new Error('MASIH ADA OPERASI KEUANGAN YANG BELUM SYNC. COBA LAGI SETELAH KONEKSI STABIL.');await resumePendingCheckoutCancels({silent:true});if(readPendingCheckoutCancels().length)throw new Error('MASIH ADA PEMBATALAN CHECKOUT YANG BELUM SELESAI SYNC.');const {data,error}=await sb.rpc('finance_backup_snapshot_v1',{p_household_id:state.household.id});if(error)throw error;const payload=validateBackupPayload({...data,app_version:CN_MONEY_VERSION});downloadBackupPayload(payload);localStorage.setItem('cn_last_backup_at',payload.exported_at||new Date().toISOString());toast('BACKUP BERHASIL DISIMPAN.')}catch(err){console.error(err);toast(err?.message||'BACKUP GAGAL.')}finally{if(btn)btn.disabled=false}}
async function handleRestoreFile(file){if(!file)return;if(!state.online)return toast('INTERNET DIPERLUKAN UNTUK RESTORE.');if(file.size>20*1024*1024)return toast('FILE BACKUP TERLALU BESAR.');try{const raw=await file.text(),payload=validateBackupPayload(JSON.parse(raw));state.restoreCandidate=payload;state.modal='restorePreview';render()}catch(err){console.error(err);toast(err?.message||'FILE BACKUP TIDAK VALID.')}}
async function executeRestore(){const payload=state.restoreCandidate;if(!payload||state.loading||!state.online)return;state.loading=true;render();try{await flushPendingFinanceOps();if(readPendingFinanceOps().length)throw new Error('RESTORE DITAHAN: MASIH ADA OPERASI KEUANGAN YANG BELUM SYNC.');await resumePendingCheckoutCancels({silent:true});if(readPendingCheckoutCancels().length)throw new Error('RESTORE DITAHAN: PEMBATALAN CHECKOUT BELUM SELESAI SYNC.');if(state.channel){await sb.removeChannel(state.channel);state.channel=null}const {error}=await sb.rpc('finance_restore_backup_v1',{p_household_id:state.household.id,p_backup:payload});if(error)throw error;clearLocalCaches();await loadAll({rerender:false,preserveCacheOnEmpty:false});subscribeRealtime();persistCaches();localStorage.setItem('cn_restore_undo_at',String(Date.now()));localStorage.removeItem('cn_restore_undo_available');state.restoreCandidate=null;state.modal='settings';state.loading=false;render();toast('RESTORE SELESAI.')}catch(err){console.error(err);state.loading=false;subscribeRealtime();render();toast(err?.message||'RESTORE GAGAL. DATA LAMA TETAP AMAN.')}}
async function undoLastRestore(){if(state.loading||!state.online)return;state.loading=true;try{if(state.channel){await sb.removeChannel(state.channel);state.channel=null}const {error}=await sb.rpc('finance_rollback_last_restore_v1',{p_household_id:state.household.id});if(error)throw error;clearLocalCaches();await loadAll({rerender:false,preserveCacheOnEmpty:false});subscribeRealtime();persistCaches();localStorage.removeItem('cn_restore_undo_available');localStorage.removeItem('cn_restore_undo_at');state.loading=false;state.modal='settings';playDeleteUndo();render();toast('RESTORE TERAKHIR DIBATALKAN.')}catch(err){console.error(err);state.loading=false;subscribeRealtime();render();toast(err?.message||'GAGAL MEMBATALKAN RESTORE.')}}
let shopEditReturnKey=null;
let purchaseReturnDbKey=null;
function consumeInAppBack(){return performAppBack()}
let startupSyncing=true,reconnectPromise=null;
async function recoverOnline(){if(reconnectPromise)return reconnectPromise;reconnectPromise=(async()=>{state.online=true;try{await ensureSession();if(!state.household)restoreHouseholdFromLocal();if(state.household){await restoreHousehold();await flushPendingBucketMutations();await flushPendingFinanceOps();await loadAll({rerender:false,preserveCacheOnEmpty:true});await resumePendingCheckoutCancels({silent:true});subscribeRealtime();persistCaches()}render();repairPushState()}catch(err){console.error('Reconnect failed',err);applyPendingBucketMutations();persistCaches();render();toast('Belum bisa sync. Data lokal tetap aman dan akan dicoba lagi.')}})();try{return await reconnectPromise}finally{reconnectPromise=null}}
window.addEventListener('online',()=>{if(!startupSyncing)recoverOnline()});window.addEventListener('offline',()=>{state.online=false;render()});window.addEventListener('pageshow',()=>{if(!startupSyncing&&state.household&&navigator.onLine)recoverOnline()});document.addEventListener('visibilitychange',()=>{if(!startupSyncing&&document.visibilityState==='visible'&&state.household&&navigator.onLine)recoverOnline()});
history.replaceState({finRoot:true},'');history.pushState({finGuard:true},'');window.addEventListener('popstate',()=>{const now=Date.now();if(performAppBack()){history.pushState({finGuard:true},'');return}if(now-refs.lastBack<1600){history.go(-1);return}refs.lastBack=now;toast('Tekan kembali sekali lagi untuk keluar.');history.pushState({finGuard:true},'')});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&consumeInAppBack())e.preventDefault()});
async function seedMissingCategories(){if(!state.household?.id||!navigator.onLine)return;const jobs=[];if(!state.categories.length)jobs.push(sb.rpc('finance_seed_categories',{p_household_id:state.household.id}));if(!state.shoppingCategories.length)jobs.push(sb.rpc('shopping_seed_categories',{p_household_id:state.household.id}));if(!jobs.length)return;const results=await Promise.all(jobs);const err=results.find(x=>x?.error)?.error;if(err)throw err;await loadAll({rerender:false,preserveCacheOnEmpty:true})}
async function boot(){loadShoppingAutocorrect().catch(()=>{});loadShoppingMasterData().then(()=>{applyShoppingMasterCatalog();if(state.household?.id){migrateLegacyShoppingTaxonomyV2416();persistCaches()}if(state.ready)render()}).catch(()=>{});const hasLocal=restoreHouseholdFromLocal();if(hasLocal){hydrateCaches();hydrateCatalogCache();state.ready=true;render()}if(!navigator.onLine){state.online=false;if(!hasLocal){state.ready=true;render()}startupSyncing=false;return}try{await ensureSession();const restored=await restoreHousehold();if(restored){hydrateCaches();await flushPendingBucketMutations();await flushPendingFinanceOps();await loadAll({rerender:false,preserveCacheOnEmpty:true});await resumePendingCheckoutCancels({silent:true});await seedMissingCategories();subscribeRealtime();persistCaches()}state.ready=true;render();repairPushState()}catch(err){console.error(err);state.ready=true;if(hasLocal||restoreHouseholdFromLocal()){hydrateCaches();applyPendingBucketMutations();persistCaches();render();toast('Cloud tidak terjangkau. Membuka data terakhir di perangkat.')}else{renderOnboarding(err?.message||'Gagal memulai aplikasi.')}}finally{startupSyncing=false}}
if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/service-worker.js',{updateViaCache:'none'}).then(r=>r.update()).catch(console.warn))}boot();
})();
