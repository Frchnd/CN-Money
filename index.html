function normalizeUom(raw){const low=String(raw||'').trim().toLowerCase().replace(/\s+/g,' ');const map={pcs:'Pcs',pc:'Pcs',piece:'Pcs',pieces:'Pcs',kg:'Kg',kilogram:'Kg',g:'Gram',gr:'Gram',gram:'Gram',l:'L',liter:'L',litre:'L',ml:'Ml',mililiter:'Ml',pack:'Pack',pak:'Pack',bungkus:'Bungkus',botol:'Botol',kaleng:'Kaleng',sachet:'Sachet',saset:'Sachet',box:'Box',kotak:'Kotak',lusin:'Lusin',ikat:'Ikat',roll:'Roll',rol:'Roll',renteng:'Renteng'};return map[low]||titleCaseWords(low||'Pcs')}
function shoppingBroadCategoryName(categoryName){
  const cat=String(categoryName||'Lainnya').trim();
  const food=new Set([
    'Makanan Pokok','Makanan Kaleng & Instan','Daging & Seafood','Telur','Protein',
    'Sayur','Buah','Susu & Produk Olahan','Bahan Baking & Dessert',
    'Bumbu & Bahan Masak','Minuman','Snack & Camilan','Frozen Food','Roti & Bakery'
  ]);

    'Tisu & Produk Kertas','Perlengkapan Dapur','Perlengkapan Rumah'
  ]);
  const personal=new Set(['Perawatan Diri','Kesehatan & Obat']);
  const family=new Set(['Bayi & Anak','Hewan Peliharaan']);
  const utility=new Set(['Alat Tulis & Sekolah','Elektronik & Baterai']);
  if(food.has(cat))return'MAKANAN & MINUMAN';
  if(home.has(cat))return'RUMAH & KEBERSIHAN';
  if(personal.has(cat))return'PERAWATAN & KESEHATAN';
  if(family.has(cat))return'KELUARGA & HEWAN';

function inferShoppingCategoryName(raw){const s=String(raw||'').toLowerCase();if(/beras|nasi|gula|tepung|mie|mi instan|oat|sereal/.test(s))return'Makanan Pokok';if(/sarden|kornet|kaleng|makanan instan|sup instan/.test(s))return'Makanan Kaleng & Instan';if(/ayam|sapi|daging|ikan|udang|cumi|seafood/.test(s))return'Daging & Seafood';if(/telur/.test(s))return'Telur';if(/tahu|tempe|tofu|kacang|edamame/.test(s))return'Protein';if(/sayur|bayam|kangkung|wortel|brokoli|kol|cabai|tomat|bawang/.test(s))return'Sayur';if(/buah|apel|pisang|jeruk|mangga|anggur|semangka/.test(s))return'Buah';if(/susu|keju|yogurt|mentega|butter/.test(s))return'Susu & Produk Olahan';if(/ragi|vanili|baking powder|soda kue|maizena|gelatin|cokelat bubuk/.test(s))return'Bahan Baking & Dessert';if(/garam|merica|lada|saus|kecap|bumbu|santan|minyak goreng/.test(s))return'Bumbu & Bahan Masak';if(/kopi|teh|air mineral|soda|sirup|jus|minuman/.test(s))return'Minuman';if(/snack|camilan|keripik|biskuit|cokelat|permen/.test(s))return'Snack & Camilan';if(/frozen|nugget|sosis|bakso/.test(s))return'Frozen Food';if(/roti|bakery|donat|kue/.test(s))return'Roti & Bakery';if(/deterjen|rinso|pewangi|laundry/.test(s))return'Laundry';if(/sikat wc|pembersih toilet|pewangi toilet|keset kamar mandi/.test(s))return'Kebutuhan Kamar Mandi';if(/sabun cuci|pel|pembersih|karbol|spons/.test(s))return'Kebersihan Rumah';if(/shampoo|sabun mandi|pasta gigi|deodorant|skincare/.test(s))return'Perawatan Diri';if(/obat|vitamin|masker|plester/.test(s))return'Kesehatan & Obat';if(/popok|diaper|bayi|susu formula/.test(s))return'Bayi & Anak';if(/kucing|anjing|pet|pakan/.test(s))return'Hewan Peliharaan';if(/pulpen|pensil|buku tulis|penghapus|spidol|alat tulis/.test(s))return'Alat Tulis & Sekolah';if(/baterai|charger|kabel|bohlam|lampu|adapter/.test(s))return'Elektronik & Baterai';if(/plastik|ziplock|cling wrap|aluminium foil|wadah|container/.test(s))return'Penyimpanan & Plastik';if(/tisu|toilet paper|kertas dapur/.test(s))return'Tisu & Produk Kertas';if(/panci|wajan|spatula|pisau dapur/.test(s))return'Perlengkapan Dapur';if(/sapu|ember|gantungan|keset|rak|hanger/.test(s))return'Perlengkapan Rumah';return'Lainnya'}
const SHOPPING_PRIORITIES=['PRIMER','SEKUNDER','PELENGKAP'];
function normalizeShoppingPriority(value){const v=String(value||'').trim().toUpperCase();return SHOPPING_PRIORITIES.includes(v)?v:''}
function inferShoppingPriority(name,category=''){
  const item=normalizeItemName(name).toLowerCase(),cat=String(category||inferShoppingCategoryName(name)).toLowerCase();
  if(/air mineral|beras|nasi|telur|sayur|buah|daging|ayam|ikan|susu formula|obat|vitamin/.test(item))return'PRIMER';
  if(/snack|camilan|permen|cokelat|soda|soft drink|donat|dessert/.test(item))return'SEKUNDER';
  const primer=['makanan pokok','daging & seafood','telur','protein','sayur','buah','susu & produk olahan','bumbu & bahan masak','kebersihan rumah','laundry','kebutuhan kamar mandi','perawatan diri','kesehatan & obat','bayi & anak','hewan peliharaan','tisu & produk kertas'];
  const sekunder=['makanan kaleng & instan','minuman','snack & camilan','frozen food','roti & bakery','sarapan & sereal','bahan baking & dessert'];
  const pelengkap=['alat tulis & sekolah','elektronik & baterai','penyimpanan & plastik','perlengkapan dapur','perlengkapan rumah'];
  if(primer.includes(cat))return'PRIMER';
  if(sekunder.includes(cat))return'SEKUNDER';
  if(pelengkap.includes(cat))return'PELENGKAP';
  return'SEKUNDER';
}
function shoppingProfileFor(name){const rawKey=String(name||'').trim().toLowerCase(),normalizedKey=normalizeItemName(name).toLowerCase();return state.shoppingProfiles.find(p=>p.item_key===normalizedKey||p.item_key===rawKey)||null}
function shoppingCategoryFor(name,fallback=''){const p=shoppingProfileFor(name);if(p?.category_id){const c=state.shoppingCategories.find(x=>x.id===p.category_id);if(c)return c.name}const known=String(fallback||'');if(state.shoppingCategories.some(c=>c.name===known))return known;return inferShoppingCategoryName(normalizeItemName(name))}
function shoppingPriorityFor(name,fallback='',category=''){const p=shoppingProfileFor(name),saved=normalizeShoppingPriority(p?.priority);if(saved)return saved;const local=normalizeShoppingPriority(fallback);if(local)return local;return inferShoppingPriority(name,category||shoppingCategoryFor(name))}
function priorityChip(priority){const p=normalizeShoppingPriority(priority)||'SEKUNDER';return`<span class="shop-badge priority ${p.toLowerCase()}">${p}</span>`}
function shoppingBadges(name,categoryFallback='',priorityFallback='',uom='',showUom=true){const cat=shoppingCategoryFor(name,categoryFallback),priority=shoppingPriorityFor(name,priorityFallback,cat);return`<div class="shop-badges"><span class="shop-badge category">${esc(cat)}</span>${priorityChip(priority)}${showUom&&uom?`<span class="shop-uom-inline">${esc(normalizeUom(uom))}</span>`:''}</div>`}
function shoppingHistoryDefaultFor(name){const target=normalizeItemName(name).toLowerCase();let best=null,bestTs=-1;for(const row of state.shoppingItems||[]){if(normalizeItemName(row.item_name||'').toLowerCase()!==target)continue;const session=(state.shoppingSessions||[]).find(s=>String(s.id)===String(row.session_id));const rawDate=session?.created_at||session?.checkout_date||row.created_at||'';const ts=Date.parse(rawDate)||0;if(ts<bestTs)continue;bestTs=ts;best={lastPrice:Number(row.unit_price||0),uom:normalizeUom(row.uom||'Pcs'),lastStore:normalizeStoreName(session?.store_name||''),lastWalletId:session?.wallet_id||'',lastPurchased:rawDate}}return best}
function smartItem(raw){const name=normalizeItemName(raw),norm=name.toLowerCase(),db=state.itemDb[norm]||{},history=shoppingHistoryDefaultFor(name)||{},profile=shoppingProfileFor(name);let uom='Pcs';if(/beras|gula|tepung|daging|ikan|ayam|cabai|buah|sayur/i.test(name))uom='Kg';if(/minyak|susu cair|air mineral/i.test(name))uom='L';uom=normalizeUom(profile?.preferred_uom||db.uom||history.uom||uom);const category=shoppingCategoryFor(name,db.category||''),priority=shoppingPriorityFor(name,db.priority||'',category);return{name,category,priority,uom,lastPrice:Number(db.lastPrice||history.lastPrice||0),lastStore:normalizeStoreName(db.lastStore||history.lastStore||''),lastWalletId:history.lastWalletId||'',lastPurchased:db.lastPurchased||history.lastPurchased||null}}
const SHOPPING_COMPLETED_VISIBLE_MS=24*60*60*1000;
let shoppingCompletedExpiryTimer=null;
function shoppingCompletedAtMs(item){
  let ts=Date.parse(item?.purchasedAt||'')||0;
  if(!ts&&item?.shoppingSessionId){
    const session=state.shoppingSessions.find(s=>String(s.id)===String(item.shoppingSessionId));
    ts=Date.parse(session?.created_at||session?.checkout_date||'')||0;
  }
  return ts;
}
function shoppingCompletedVisible(item,now=Date.now()){
  const ts=shoppingCompletedAtMs(item);
  return !ts||now-ts<SHOPPING_COMPLETED_VISIBLE_MS;
}
function scheduleShoppingCompletedExpiry(items){
  if(shoppingCompletedExpiryTimer){clearTimeout(shoppingCompletedExpiryTimer);shoppingCompletedExpiryTimer=null}
  const now=Date.now(),delays=(items||[])
    .map(x=>shoppingCompletedAtMs(x))
    .filter(Boolean)
    .map(ts=>SHOPPING_COMPLETED_VISIBLE_MS-(now-ts))
    .filter(ms=>ms>0);
  if(!delays.length)return;
  const wait=Math.max(250,Math.min(...delays)+100);
  shoppingCompletedExpiryTimer=setTimeout(()=>{
    shoppingCompletedExpiryTimer=null;
    if(state.tab==='shopping'&&state.shopTab==='checkout')render();
  },Math.min(wait,2147483000));
}

function renderShopData(){
  const base=Object.entries(state.itemDb||{}).map(([key,value])=>({...value,_dbKey:key}));
  const alpha=(a,b)=>String(a.name||'').localeCompare(String(b.name||''),'id',{sensitivity:'base'});
  const recent=(a,b)=>new Date(b.lastPurchased||0)-new Date(a.lastPurchased||0)||alpha(a,b);
  const mode=state.dataView||'all';
  const filters=[
    ['all','SEMUA'],
    ['alpha','ALPHABET'],
    ['category','KATEGORI'],
    ['subcategory','SUB KATEGORI'],
    ['priority','PRIORITAS']
  ];
  let content='';

  if(mode==='alpha'){
    const sorted=[...base].sort(alpha),groups={};
    sorted.forEach(x=>{
      const k=(String(x.name||'#').trim()[0]||'#').toUpperCase();
      (groups[k]||(groups[k]=[])).push(x)
    });
    content=Object.entries(groups)
      .map(([k,v])=>`<div class="category-head">${esc(k)}</div>${renderDbFlat(v)}`)
      .join('');
  }else if(mode==='category'){
    const groups={};
    base.forEach(x=>{
      const sub=shoppingCategoryFor(x.name,x.category);
      const cat=shoppingBroadCategoryName(sub);
      (groups[cat]||(groups[cat]=[])).push(x)
    });
    content=SHOPPING_BROAD_CATEGORY_ORDER
      .filter(cat=>groups[cat]?.length)
      .map(cat=>`<div class="category-head">${esc(cat)}</div>${renderDbFlat(groups[cat].sort(alpha))}`)
      .join('');
  }else if(mode==='subcategory'){
    const groups={};
    base.forEach(x=>{
      const cat=shoppingCategoryFor(x.name,x.category);
      (groups[cat]||(groups[cat]=[])).push(x)
    });
    const order=shoppingCategoryOrder().map(c=>c.name);
    content=Object.keys(groups)
      .sort((a,b)=>{
        const ai=order.indexOf(a),bi=order.indexOf(b);
        return(ai<0?999:ai)-(bi<0?999:bi)||a.localeCompare(b,'id',{sensitivity:'base'})
      })
      .map(cat=>`<div class="category-head">${esc(cat)}</div>${renderDbFlat(groups[cat].sort(alpha))}`)
      .join('');
  }else if(mode==='priority'){
    const groups={PRIMER:[],SEKUNDER:[],PELENGKAP:[]};
    base.forEach(x=>{
      const cat=shoppingCategoryFor(x.name,x.category);
      const p=shoppingPriorityFor(x.name,x.priority,cat);
      (groups[p]||(groups[p]=[])).push(x)
    });
    content=['PRIMER','SEKUNDER','PELENGKAP']
      .filter(k=>groups[k]?.length)
      .map(k=>`<div class="category-head">${k}</div>${renderDbFlat(groups[k].sort(alpha))}`)
      .join('');
  }else{
    content=renderDbFlat([...base].sort(recent));
  }

  if(!base.length){
    content=`<div class="card empty empty-minimal"><div class="big">${uiIcon('box')}</div><b>BELUM ADA DATA BARANG</b></div>`;
  }

  return`${shopTabs()}<input id="dbSearch" class="input search" placeholder="Cari data barang…" autocomplete="off" autocorrect="off" spellcheck="false"><div class="data-filter-row">${filters.map(([v,l])=>`<button type="button" class="data-filter-chip ${mode===v?'active':''}" data-dbview="${v}">${l}</button>`).join('')}</div><div id="dbList">${content}</div>`
}

function receiptPdfSafeText(value){
  return String(value??'')
    .normalize('NFKD')
    .replace(/[\u0300-\u036f]/g,'')
    .replace(/[–—]/g,'-')
    .replace(/[“”]/g,'"')
    .replace(/[‘’]/g,"'")
    .replace(/[^\x20-\x7E]/g,'?')
}
function receiptPdfEscape(value){
  return receiptPdfSafeText(value).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)')
}
function receiptPdfWrap(value,maxChars=36){
  const text=receiptPdfSafeText(value).trim();
  if(!text)return[''];
  const words=text.split(/\s+/),lines=[];
  let line='';
  for(const word of words){
    if(word.length>maxChars){
      if(line){lines.push(line);line=''}
      for(let i=0;i<word.length;i+=maxChars)lines.push(word.slice(i,i+maxChars))
      continue
    }
    const next=line?line+' '+word:word;
    if(next.length>maxChars){if(line)lines.push(line);line=word}else line=next
  }
  if(line)lines.push(line);
  return lines.length?lines:[''];
}
function receiptPdfMoney(value){
  const n=Math.round(Number(value)||0);
  return 'Rp '+new Intl.NumberFormat('id-ID',{maximumFractionDigits:0}).format(n)
}
function receiptPdfDate(value){
  const raw=String(value||today());
  const d=new Date(raw+'T00:00:00');
  if(Number.isNaN(d.getTime()))return raw;
  return new Intl.DateTimeFormat('id-ID',{day:'2-digit',month:'2-digit',year:'numeric'}).format(d)
}
function receiptPdfFilename(session){
  const date=String(session?.checkout_date||today()).slice(0,10);
  return `CN-MONEY-Receipt-${date}.pdf`
}
function buildReceiptPdf(session,items,walletName){
  const pageW=226.7717,margin=13,font=8.2,lineH=11.2,maxChars=39;
  const rows=[];
  const push=(text,opt={})=>rows.push({text:receiptPdfSafeText(text),...opt});
  const rule=()=>rows.push({rule:true});
  const pair=(left,right,opt={})=>rows.push({left:receiptPdfSafeText(left),right:receiptPdfSafeText(right),...opt});

  push('CN MONEY',{align:'center',bold:true,size:11});
  push('RECEIPT',{align:'center',bold:true,size:9});
  rule();
  for(const line of receiptPdfWrap(session?.store_name||'BELANJA BULANAN',maxChars))push(line,{bold:true});
  pair('TANGGAL',receiptPdfDate(session?.checkout_date));
  pair('DOMPET',walletName||'DOMPET');
  rule();

  const safeItems=Array.isArray(items)?items:[];
  safeItems.forEach((item,idx)=>{
    receiptPdfWrap(String(item?.item_name||'BARANG').toUpperCase(),maxChars).forEach((line,i)=>push(line,{bold:i===0}));
    const qty=Number(item?.quantity||0);
    const uom=receiptPdfSafeText(item?.uom||'Pcs');
    const unit=Number(item?.unit_price||0);
    const subtotal=Number(item?.subtotal||qty*unit||0);
    pair(`${qty} ${uom} x ${receiptPdfMoney(unit)}`,receiptPdfMoney(subtotal));
    if(idx<safeItems.length-1)push('');
  });

  rule();
  pair('TOTAL',receiptPdfMoney(session?.total_amount||0),{bold:true,size:10});
  rule();
  push(`${safeItems.length} ITEM`,{align:'center'});
  push('CN MONEY',{align:'center',bold:true});
  push('Terima kasih',{align:'center'});

  const top=16,bottom=17;
  const pageH=Math.max(170,top+bottom+rows.length*lineH);
  let y=pageH-top;
  const commands=[];
  const textWidth=(txt,size)=>receiptPdfSafeText(txt).length*size*0.6;
  const textCmd=(txt,x,yy,size=font,isBold=false)=>{
    commands.push(`BT /${isBold?'F2':'F1'} ${size.toFixed(2)} Tf 1 0 0 1 ${x.toFixed(2)} ${yy.toFixed(2)} Tm (${receiptPdfEscape(txt)}) Tj ET`)
  };

  for(const row of rows){
    if(row.rule){
      const yy=y+3;
      commands.push(`0.55 w ${margin.toFixed(2)} ${yy.toFixed(2)} m ${(pageW-margin).toFixed(2)} ${yy.toFixed(2)} l S`);
      y-=lineH;
      continue;
    }
    const size=Number(row.size||font);
    if(Object.prototype.hasOwnProperty.call(row,'left')){
      const left=row.left||'',right=row.right||'';
      textCmd(left,margin,y,size,!!row.bold);
      textCmd(right,Math.max(margin,pageW-margin-textWidth(right,size)),y,size,!!row.bold);
      y-=lineH;
      continue;
    }
    const txt=row.text||'';
    let x=margin;
    if(row.align==='center')x=Math.max(margin,(pageW-textWidth(txt,size))/2);
    else if(row.align==='right')x=Math.max(margin,pageW-margin-textWidth(txt,size));
    textCmd(txt,x,y,size,!!row.bold);
    y-=lineH;
  }

  const stream=commands.join('\n')+'\n';
  const objects=[
    '<< /Type /Catalog /Pages 2 0 R >>',
    '<< /Type /Pages /Kids [3 0 R] /Count 1 >>',
    `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pageW.toFixed(2)} ${pageH.toFixed(2)}] /Resources << /Font << /F1 4 0 R /F2 5 0 R >> >> /Contents 6 0 R >>`,
    '<< /Type /Font /Subtype /Type1 /BaseFont /Courier /Encoding /WinAnsiEncoding >>',
    '<< /Type /Font /Subtype /Type1 /BaseFont /Courier-Bold /Encoding /WinAnsiEncoding >>',
    `<< /Length ${stream.length} >>\nstream\n${stream}endstream`
  ];

  let pdf='%PDF-1.4\n%CNMONEY\n';
  const offsets=[0];
  objects.forEach((obj,i)=>{
    offsets[i+1]=pdf.length;
    pdf+=`${i+1} 0 obj\n${obj}\nendobj\n`;
  });
  const xref=pdf.length;
  pdf+=`xref\n0 ${objects.length+1}\n0000000000 65535 f \n`;
  for(let i=1;i<=objects.length;i++)pdf+=String(offsets[i]).padStart(10,'0')+' 00000 n \n';
  pdf+=`trailer\n<< /Size ${objects.length+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`;
  return new TextEncoder().encode(pdf)
}

async function handleShopCategorySubmit(e){
  e.preventDefault();
  if(state.loading||!state.online)return;
  const itemId=e.currentTarget.dataset.itemid;
  const oldName=String(e.currentTarget.dataset.name||'').trim();
  const newName=normalizeItemName(document.getElementById('shopProfileName')?.value||oldName);
  const categoryId=document.getElementById('shopCategorySelect').value;
  const priority=normalizeShoppingPriority(document.getElementById('shopPriorityValue')?.value||'');
  const uom=normalizeUom(document.getElementById('shopCategoryUom').value||'Pcs');
  if(!newName)return toast('NAMA BARANG WAJIB DIISI.');
  if(!categoryId)return toast('PILIH KATEGORI.');
  if(!priority)return toast('PILIH PRIORITAS.');

  const oldNorm=normalizeItemName(oldName).toLowerCase(),newNorm=normalizeItemName(newName).toLowerCase();
  const existingDb=state.itemDb[newNorm];
  if(newNorm!==oldNorm&&existingDb)return toast('NAMA BARANG SUDAH ADA DI DATA BARANG.');
  if(newNorm!==oldNorm&&state.checklist.some(x=>String(x.id)!==String(itemId||'')&&normalizeItemName(x.name).toLowerCase()===newNorm))return toast('NAMA BARANG SUDAH ADA DI LIST.');

  state.loading=true;
  const profileRes=await sb.rpc('shopping_set_item_profile',{p_household_id:state.household.id,p_item_name:newName,p_category_id:categoryId,p_preferred_uom:uom});
  if(profileRes.error){state.loading=false;return toast(profileRes.error.message||'GAGAL MENYIMPAN PROFIL BARANG.')}
  const priorityRes=await sb.rpc('shopping_set_item_priority',{p_household_id:state.household.id,p_item_name:newName,p_priority:priority});
  if(priorityRes.error){state.loading=false;return toast(priorityRes.error.message||'GAGAL MENYIMPAN PRIORITAS.')}

  if(newNorm!==oldNorm){
    const del=await sb.rpc('shopping_delete_item_profile',{p_household_id:state.household.id,p_item_name:oldName});
    if(del.error)console.warn('Old profile cleanup',del.error);
  }

  const cat=state.shoppingCategories.find(c=>c.id===categoryId)?.name||'Lainnya';
  state.checklist=state.checklist.map(x=>{
    const matches=String(x.id)===String(itemId||'')||(!itemId&&normalizeItemName(x.name).toLowerCase()===oldNorm);
    return matches?{...x,name:newName,normalized:newNorm,category:cat,priority}:x
  });

  const sourceKey=state.itemDb[oldNorm]?oldNorm:(shopEditReturnKey&&state.itemDb[shopEditReturnKey]?shopEditReturnKey:null);
  if(sourceKey){
    const oldDb=state.itemDb[sourceKey]||{};
    const aliases=[...(Array.isArray(oldDb.aliases)?oldDb.aliases:[]),...(newNorm!==oldNorm?[oldName]:[])]
      .map(x=>String(x||'').trim()).filter(Boolean);
    const uniqueAliases=[...new Set(aliases.filter(x=>normalizeItemName(x).toLowerCase()!==newNorm))];
    const next={...state.itemDb};
    delete next[sourceKey];
    if(oldNorm!==sourceKey)delete next[oldNorm];
    next[newNorm]={...oldDb,name:newName,normalized:newNorm,category:cat,priority,uom:uom||oldDb.uom,aliases:uniqueAliases};
    state.itemDb=next;
  }

  try{
    await Promise.all([updateBucket('checklist',state.checklist),updateBucket('database',state.itemDb)]);
  }catch(err){console.error(err)}

  const returnKey=shopEditReturnKey?newNorm:null;
  shopEditReturnKey=null;
  state.modal=null;
  state.loading=false;
  await loadAll({rerender:false,preserveCacheOnEmpty:true});
  if(returnKey&&state.itemDb[returnKey])state.modal='dbdetail:'+encodeURIComponent(returnKey);
  render();
  toast('PROFIL BARANG DISIMPAN.');
}

function backupDataArrays(payload){return payload?.data&&typeof payload.data==='object'?payload.data:null}
function backupSummary(payload){const d=backupDataArrays(payload)||{};return{wallets:Array.isArray(d.wallets)?d.wallets.length:0,transactions:Array.isArray(d.transactions)?d.transactions.length:0,investments:Array.isArray(d.investments)?d.investments.length:0,assets:Array.isArray(d.assets)?d.assets.length:0,shoppingSessions:Array.isArray(d.shopping_sessions)?d.shopping_sessions.length:0,shoppingItems:Array.isArray(d.shopping_session_items)?d.shopping_session_items.length:0}}
function validateBackupPayload(payload){if(!payload||typeof payload!=='object')throw new Error('FILE BACKUP TIDAK VALID.');if(payload.app!=='CN MONEY'||payload.backup_format!=='CNMONEY_FULL_BACKUP'||Number(payload.schema_version)!==1)throw new Error('FORMAT BACKUP TIDAK DIDUKUNG.');if(!state.household?.id||String(payload.household?.id||'')!==String(state.household.id))throw new Error('BACKUP INI BUKAN DARI HOUSEHOLD YANG SAMA.');const d=backupDataArrays(payload),required=['wallets','categories','transactions','investments','assets','monthly_budgets','household_data','shopping_sessions','shopping_session_items','shopping_categories','shopping_item_profiles'];if(!d)throw new Error('ISI BACKUP TIDAK LENGKAP.');for(const key of required)if(!Array.isArray(d[key]))throw new Error('ISI BACKUP TIDAK LENGKAP.');return payload}
function backupDateTime(raw){try{return new Intl.DateTimeFormat('id-ID',{dateStyle:'medium',timeStyle:'short'}).format(new Date(raw))}catch{return String(raw||'-')}}
async function backupData(){if(!state.household?.id)return;if(!state.online)return toast('INTERNET DIPERLUKAN UNTUK BACKUP PENUH.');const btn=document.getElementById('backupBtn');if(btn)btn.disabled=true;try{const {data,error}=await sb.rpc('finance_backup_snapshot_v1',{p_household_id:state.household.id});if(error)throw error;const payload=validateBackupPayload({...data,app_version:CN_MONEY_VERSION});downloadBackupPayload(payload);localStorage.setItem('cn_last_backup_at',payload.exported_at||new Date().toISOString());toast('BACKUP BERHASIL DISIMPAN.')}catch(err){console.error(err);toast(err?.message||'BACKUP GAGAL.')}finally{if(btn)btn.disabled=false}}
async function handleRestoreFile(file){if(!file)return;if(!state.online)return toast('INTERNET DIPERLUKAN UNTUK RESTORE.');if(file.size>20*1024*1024)return toast('FILE BACKUP TERLALU BESAR.');try{const raw=await file.text(),payload=validateBackupPayload(JSON.parse(raw));state.restoreCandidate=payload;state.modal='restorePreview';render()}catch(err){console.error(err);toast(err?.message||'FILE BACKUP TIDAK VALID.')}}
async function executeRestore(){const payload=state.restoreCandidate;if(!payload||state.loading||!state.online)return;state.loading=true;render();try{if(state.channel){await sb.removeChannel(state.channel);state.channel=null}const {error}=await sb.rpc('finance_restore_backup_v1',{p_household_id:state.household.id,p_backup:payload});if(error)throw error;clearLocalCaches();await loadAll({rerender:false,preserveCacheOnEmpty:false});subscribeRealtime();persistCaches();localStorage.setItem('cn_restore_undo_at',String(Date.now()));localStorage.removeItem('cn_restore_undo_available');state.restoreCandidate=null;state.modal='settings';state.loading=false;render();toast('RESTORE SELESAI.')}catch(err){console.error(err);state.loading=false;subscribeRealtime();render();toast(err?.message||'RESTORE GAGAL. DATA LAMA TETAP AMAN.')}}
async function undoLastRestore(){if(state.loading||!state.online)return;state.loading=true;try{if(state.channel){await sb.removeChannel(state.channel);state.channel=null}const {error}=await sb.rpc('finance_rollback_last_restore_v1',{p_household_id:state.household.id});if(error)throw error;clearLocalCaches();await loadAll({rerender:false,preserveCacheOnEmpty:false});subscribeRealtime();persistCaches();localStorage.removeItem('cn_restore_undo_available');localStorage.removeItem('cn_restore_undo_at');state.loading=false;state.modal='settings';render();toast('RESTORE TERAKHIR DIBATALKAN.')}catch(err){console.error(err);state.loading=false;subscribeRealtime();render();toast(err?.message||'GAGAL MEMBATALKAN RESTORE.')}}
let shopEditReturnKey=null;
let startupSyncing=true,reconnectPromise=null;
async function recoverOnline(){if(reconnectPromise)return reconnectPromise;reconnectPromise=(async()=>{state.online=true;try{await ensureSession();if(!state.household)restoreHouseholdFromLocal();if(state.household){await restoreHousehold();await loadAll({rerender:false,preserveCacheOnEmpty:true});subscribeRealtime();persistCaches()}render();repairPushState()}catch(err){console.error('Reconnect failed',err);render();toast('Belum bisa sync. Data lokal tetap aman.')}})();try{return await reconnectPromise}finally{reconnectPromise=null}}
window.addEventListener('online',()=>{if(!startupSyncing)recoverOnline()});window.addEventListener('offline',()=>{state.online=false;render()});window.addEventListener('pageshow',()=>{if(!startupSyncing&&state.household&&navigator.onLine)recoverOnline()});document.addEventListener('visibilitychange',()=>{if(!startupSyncing&&document.visibilityState==='visible'&&state.household&&navigator.onLine)recoverOnline()});
history.replaceState({finRoot:true},'');history.pushState({finGuard:true},'');window.addEventListener('popstate',()=>{const now=Date.now();if(refs.modal){if(state.modal==='restorePreview'){state.restoreCandidate=null;state.modal='settings'}else if(state.modal==='guide'){state.modal='settings'}else if(state.modal==='catalogSettings'){state.catalogSearch='';state.modal='settings'}else if(state.modal==='receiptPeriodPicker'){state.receiptPickerMonth=null;state.receiptPickerYear=null;state.modal=null}else{state.modal=null;state.restoreCandidate=null}state.confirmation=null;state.txClientId=null;render();history.pushState({finGuard:true},'');return}if(refs.tab!=='dashboard'){state.tab='dashboard';render();history.pushState({finGuard:true},'');return}if(now-refs.lastBack<1600){history.go(-1);return}refs.lastBack=now;toast('Tekan kembali sekali lagi untuk keluar.');history.pushState({finGuard:true},'')});
async function seedMissingCategories(){if(!state.household?.id||!navigator.onLine)return;const jobs=[];if(!state.categories.length)jobs.push(sb.rpc('finance_seed_categories',{p_household_id:state.household.id}));if(!state.shoppingCategories.length)jobs.push(sb.rpc('shopping_seed_categories',{p_household_id:state.household.id}));if(!jobs.length)return;const results=await Promise.all(jobs);const err=results.find(x=>x?.error)?.error;if(err)throw err;await loadAll({rerender:false,preserveCacheOnEmpty:true})}
async function boot(){const hasLocal=restoreHouseholdFromLocal();if(hasLocal){hydrateCaches();hydrateCatalogCache();state.ready=true;render()}if(!navigator.onLine){state.online=false;if(!hasLocal){state.ready=true;render()}startupSyncing=false;return}try{await ensureSession();const restored=await restoreHousehold();if(restored){hydrateCaches();await loadAll({rerender:false,preserveCacheOnEmpty:true});await seedMissingCategories();subscribeRealtime();persistCaches()}state.ready=true;render();repairPushState()}catch(err){console.error(err);state.ready=true;if(hasLocal||restoreHouseholdFromLocal()){hydrateCaches();render();toast('Cloud tidak terjangkau. Membuka data terakhir di perangkat.')}else{renderOnboarding(err?.message||'Gagal memulai aplikasi.')}}finally{startupSyncing=false}}
if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/service-worker.js',{updateViaCache:'none'}).catch(console.warn))}boot();
})();
</script>
