function normalizeUom(raw){const low=String(raw||'').trim().toLowerCase().replace(/\s+/g,' ');const map={pcs:'Pcs',pc:'Pcs',piece:'Pcs',pieces:'Pcs',kg:'Kg',kilogram:'Kg',g:'Gram',gr:'Gram',gram:'Gram',l:'L',liter:'L',litre:'L',ml:'Ml',mililiter:'Ml',pack:'Pack',pak:'Pack',bungkus:'Bungkus',botol:'Botol',kaleng:'Kaleng',sachet:'Sachet',saset:'Sachet',box:'Box',kotak:'Kotak',lusin:'Lusin',ikat:'Ikat',roll:'Roll',rol:'Roll',renteng:'Renteng'};return map[low]||titleCaseWords(low||'Pcs')}
function shoppingCategoryOrder(){return [...state.shoppingCategories].sort((a,b)=>{if(a.name==='Lainnya')return 1;if(b.name==='Lainnya')return-1;return Number(a.sort_order||0)-Number(b.sort_order||0)||a.name.localeCompare(b.name)})}
function inferShoppingCategoryName(raw){const s=String(raw||'').toLowerCase();if(/beras|nasi|gula|tepung|mie|mi instan|oat|sereal/.test(s))return'Makanan Pokok';if(/sarden|kornet|kaleng|makanan instan|sup instan/.test(s))return'Makanan Kaleng & Instan';if(/ayam|sapi|daging|ikan|udang|cumi|seafood/.test(s))return'Daging & Seafood';if(/telur/.test(s))return'Telur';if(/tahu|tempe|tofu|kacang|edamame/.test(s))return'Protein';if(/sayur|bayam|kangkung|wortel|brokoli|kol|cabai|tomat|bawang/.test(s))return'Sayur';if(/buah|apel|pisang|jeruk|mangga|anggur|semangka/.test(s))return'Buah';if(/susu|keju|yogurt|mentega|butter/.test(s))return'Susu & Produk Olahan';if(/ragi|vanili|baking powder|soda kue|maizena|gelatin|cokelat bubuk/.test(s))return'Bahan Baking & Dessert';if(/garam|merica|lada|saus|kecap|bumbu|santan|minyak goreng/.test(s))return'Bumbu & Bahan Masak';if(/kopi|teh|air mineral|soda|sirup|jus|minuman/.test(s))return'Minuman';if(/snack|camilan|keripik|biskuit|cokelat|permen/.test(s))return'Snack & Camilan';if(/frozen|nugget|sosis|bakso/.test(s))return'Frozen Food';if(/roti|bakery|donat|kue/.test(s))return'Roti & Bakery';if(/deterjen|rinso|pewangi|laundry/.test(s))return'Laundry';if(/sikat wc|pembersih toilet|pewangi toilet|keset kamar mandi/.test(s))return'Kebutuhan Kamar Mandi';if(/sabun cuci|pel|pembersih|karbol|spons/.test(s))return'Kebersihan Rumah';if(/shampoo|sabun mandi|pasta gigi|deodorant|skincare/.test(s))return'Perawatan Diri';if(/obat|vitamin|masker|plester/.test(s))return'Kesehatan & Obat';if(/popok|diaper|bayi|susu formula/.test(s))return'Bayi & Anak';if(/kucing|anjing|pet|pakan/.test(s))return'Hewan Peliharaan';if(/pulpen|pensil|buku tulis|penghapus|spidol|alat tulis/.test(s))return'Alat Tulis & Sekolah';if(/baterai|charger|kabel|bohlam|lampu|adapter/.test(s))return'Elektronik & Baterai';if(/plastik|ziplock|cling wrap|aluminium foil|wadah|container/.test(s))return'Penyimpanan & Plastik';if(/tisu|toilet paper|kertas dapur/.test(s))return'Tisu & Produk Kertas';if(/panci|wajan|spatula|pisau dapur/.test(s))return'Perlengkapan Dapur';if(/sapu|ember|gantungan|keset|rak|hanger/.test(s))return'Perlengkapan Rumah';return'Lainnya'}
const SHOPPING_PRIORITIES=['PRIMER','SEKUNDER','PELENGKAP'];
function normalizeShoppingPriority(value){const v=String(value||'').trim().toUpperCase();return SHOPPING_PRIORITIES.includes(v)?v:''}
function inferShoppingPriority(name,category=''){
  const item=normalizeItemName(name).toLowerCase(),cat=String(category||inferShoppingCategoryName(name)).toLowerCase();
  if(/air mineral|beras|nasi|telur|sayur|buah|daging|ayam|ikan|susu formula|obat|vitamin/.test(item))return'PRIMER';
  if(/snack|camilan|permen|cokelat|soda|soft drink|donat|dessert/.test(item))return'SEKUNDER';
  const primer=['makanan pokok','daging & seafood','telur','protein','sayur','buah','susu & produk olahan','bumbu & bahan masak','kebersihan rumah','laundry','kebutuhan kamar mandi','perawatan diri','kesehatan & obat','bayi & anak','hewan peliharaan','tisu & produk kertas'];
  const sekunder=['makanan kaleng & instan','minuman','snack & camilan','frozen food','roti & bakery','sarapan & sereal','bahan baking & dessert'];
  const pelengkap=['alat tulis & sekolah','elektronik & baterai','penyimpanan & plastik','perlengkapan dapur','perlengkapan rumah'];
  if(primer.includes(cat))return'PRIMER';
  if(sekunder.includes(cat))return'SEKUNDER';
  if(pelengkap.includes(cat))return'PELENGKAP';
  return'SEKUNDER';
}
function shoppingProfileFor(name){const rawKey=String(name||'').trim().toLowerCase(),normalizedKey=normalizeItemName(name).toLowerCase();return state.shoppingProfiles.find(p=>p.item_key===normalizedKey||p.item_key===rawKey)||null}
function shoppingCategoryFor(name,fallback=''){const p=shoppingProfileFor(name);if(p?.category_id){const c=state.shoppingCategories.find(x=>x.id===p.category_id);if(c)return c.name}const known=String(fallback||'');if(state.shoppingCategories.some(c=>c.name===known))return known;return inferShoppingCategoryName(normalizeItemName(name))}
function shoppingPriorityFor(name,fallback='',category=''){const p=shoppingProfileFor(name),saved=normalizeShoppingPriority(p?.priority);if(saved)return saved;const local=normalizeShoppingPriority(fallback);if(local)return local;return inferShoppingPriority(name,category||shoppingCategoryFor(name))}
function priorityChip(priority){const p=normalizeShoppingPriority(priority)||'SEKUNDER';return`<span class="shop-badge priority ${p.toLowerCase()}">${p}</span>`}
function shoppingBadges(name,categoryFallback='',priorityFallback='',uom=''){const cat=shoppingCategoryFor(name,categoryFallback),priority=shoppingPriorityFor(name,priorityFallback,cat);return`<div class="shop-badges"><span class="shop-badge category">${esc(cat)}</span>${priorityChip(priority)}${uom?`<span class="shop-uom-inline">${esc(normalizeUom(uom))}</span>`:''}</div>`}
function smartItem(raw){const name=normalizeItemName(raw);let uom='Pcs';if(/beras|gula|tepung|daging|ikan|ayam|cabai|buah|sayur/i.test(name))uom='Kg';if(/minyak|susu cair|air mineral/i.test(name))uom='L';const profile=shoppingProfileFor(name);if(profile?.preferred_uom)uom=normalizeUom(profile.preferred_uom);const category=shoppingCategoryFor(name);return{name,category,priority:shoppingPriorityFor(name,'',category),uom:normalizeUom(uom)}}
function renderShopping(){if(state.shopTab==='data')return renderShopData();if(state.shopTab==='receipt')return renderShopReceipt();state.shopTab='checkout';return renderShopCheckout()}
function shopTabs(){return`<div class="subtabs shop-tabs-three"><button class="subtab ${state.shopTab==='checkout'?'active':''}" data-shoptab="checkout">LIST BELANJAAN</button><button class="subtab ${state.shopTab==='data'?'active':''}" data-shoptab="data">DATA BARANG</button><button class="subtab ${state.shopTab==='receipt'?'active':''}" data-shoptab="receipt">RECEIPT</button></div>`}
function renderShopCheckout(){const active=state.checklist.filter(x=>!x.purchased).sort((a,b)=>new Date(b.addedAt||0)-new Date(a.addedAt||0)),done=state.checklist.filter(x=>x.purchased).sort((a,b)=>new Date(b.purchasedAt||0)-new Date(a.purchasedAt||0)),groups={};active.forEach(x=>{const cat=shoppingCategoryFor(x.name,x.category);(groups[cat]||(groups[cat]=[])).push(x)});const order=shoppingCategoryOrder().map(c=>c.name);const names=Object.keys(groups).sort((a,b)=>{const ai=order.indexOf(a),bi=order.indexOf(b);return(ai<0?999:ai)-(bi<0?999:bi)||a.localeCompare(b)});return`${shopTabs()}<div class="card shopping-add"><input id="shopInput" class="input" placeholder="Tambah barang belanja…" autocomplete="off" autocorrect="off" spellcheck="false"><button id="shopAdd" class="btn btn-primary btn-square" aria-label="Tambah barang">+</button></div><div class="section-head"><div><div class="section-title">DAFTAR BELANJA</div><div class="section-sub">${active.length} BELUM DIBELI</div></div></div>${active.length?names.map(cat=>`<div class="category-head">${esc(cat)}</div><div class="card">${groups[cat].map(x=>{const db=state.itemDb[x.normalized]||{},last=Number(db.lastPrice||0),uom=db.uom||shoppingProfileFor(x.name)?.preferred_uom||smartItem(x.name).uom,priority=shoppingPriorityFor(x.name,x.priority||db.priority,cat);return`<div class="shop-item"><button class="shop-main shop-tap" data-checkout="${esc(x.id)}" aria-label="Checkout ${esc(x.name)}"><div class="shop-name">${esc(x.name)}</div>${shoppingBadges(x.name,cat,priority,uom)}</button><div class="shop-side"><div class="shop-price ${last?'':'muted'}">${last?rupiah(last):'BELUM ADA HARGA'}</div><div class="shop-actions"><button class="icon-action primary" data-shopcat="${esc(x.id)}" aria-label="Edit kategori dan prioritas" title="Edit kategori & prioritas">${uiIcon('edit')}</button><button class="mini-action trash-action" data-delete-shop="${esc(x.id)}" aria-label="Hapus barang" title="Hapus">${uiIcon('trash')}</button></div></div></div>`}).join('')}</div>`).join(''):`<div class="card empty"><div class="big">🛒</div><b>DAFTAR KOSONG</b><span>TAMBAHKAN KEBUTUHAN BELANJA DI ATAS.</span></div>`}${done.length?`<div class="section-head"><div><div class="section-title">SUDAH DIBELI</div></div></div><div class="card">${done.slice(0,30).map(x=>{const sess=state.shoppingSessions.find(s=>s.id===x.shoppingSessionId),total=Number(sess?.total_amount||0),cat=shoppingCategoryFor(x.name,x.category),priority=shoppingPriorityFor(x.name,x.priority,cat);return`<div class="shop-item purchased"><div class="shop-main"><div class="shop-name">${esc(x.name)}</div>${shoppingBadges(x.name,cat,priority)}${x.purchasedAt?`<div class="shop-meta">${esc(dateLabel(x.purchasedAt))}</div>`:''}</div><div class="shop-side"><div class="shop-price ${total?'':'muted'}">${total?rupiah(total):'SELESAI'}</div>${x.shoppingSessionId?`<div class="shop-actions"><button class="icon-action danger" data-cancel-checkout="${esc(x.shoppingSessionId)}" aria-label="Batalkan checkout" title="Batalkan checkout">${uiIcon('undo')}</button></div>`:''}</div></div>`}).join('')}</div>`:''}`}
function renderShopData(){const arr=Object.entries(state.itemDb||{}).map(([key,value])=>({...value,_dbKey:key})).sort((a,b)=>new Date(b.lastPurchased||0)-new Date(a.lastPurchased||0)||String(a.name||'').localeCompare(String(b.name||'')));return`${shopTabs()}<input id="dbSearch" class="input search" placeholder="Cari data barang…" autocomplete="off" autocorrect="off" spellcheck="false"><div id="dbList">${renderDbList(arr)}</div>`}
function renderDbList(arr){if(!arr.length)return`<div class="card empty"><div class="big">📦</div><b>BELUM ADA DATA BARANG</b><span>DATA HARGA TERBENTUK OTOMATIS SETELAH CHECKOUT.</span></div>`;const groups={};arr.forEach(x=>{const cat=shoppingCategoryFor(x.name,x.category);(groups[cat]||(groups[cat]=[])).push(x)});const order=shoppingCategoryOrder().map(c=>c.name);return Object.keys(groups).sort((a,b)=>(order.indexOf(a)<0?999:order.indexOf(a))-(order.indexOf(b)<0?999:order.indexOf(b))).map(cat=>`<div class="category-head">${esc(cat)}</div><div class="db-grid">${groups[cat].map(x=>{const priority=shoppingPriorityFor(x.name,x.priority,cat);return`<button type="button" class="card db-card db-card-open" data-dbdetail="${encodeURIComponent(x._dbKey||x.normalized||String(x.name||'').toLowerCase())}" data-db-name="${esc(String(x.name||'').toLowerCase())}" aria-label="Buka detail ${esc(x.name||'barang')}"><div class="db-row"><div class="db-card-main"><div class="db-name">${esc(x.name||'-')}</div>${shoppingBadges(x.name,cat,priority,x.uom||'Pcs')}${x.lastStore?`<div class="db-meta">${esc(normalizeStoreName(x.lastStore))}</div>`:''}</div><div class="db-side"><div class="db-price">${rupiah(x.lastPrice||0)}</div><div class="db-detail-pill">DETAIL</div></div></div></button>`}).join('')}</div>`).join('')}
function renderShopHistory(){const sessions=state.shoppingSessions.filter(s=>String(s.checkout_date||'').startsWith(state.month)).sort((a,b)=>new Date(b.created_at||b.checkout_date||0)-new Date(a.created_at||a.checkout_date||0));return`${shopTabs()}<div class="section-head" style="margin-top:2px"><div><div class="section-title">History Belanja</div></div>${monthTrigger()}</div>${sessions.length?sessions.map(s=>{const items=state.shoppingItems.filter(i=>i.session_id===s.id);return`<div class="card history-shop-card"><div class="receipt-top"><div><div class="receipt-store">${esc(s.store_name||'Belanja Bulanan')}</div><div class="db-meta">${dateLabel(s.checkout_date)} · ${items.length} item · ${esc(state.wallets.find(w=>w.id===s.wallet_id)?.name||'Dompet')}</div></div><div class="receipt-total">${rupiah(s.total_amount)}</div></div><div class="receipt-actions"><button class="icon-action primary" data-view-receipt="${s.id}" aria-label="Lihat receipt" title="Lihat receipt">${uiIcon('receipt')}</button><button class="icon-action danger" data-cancel-checkout="${s.id}" aria-label="Batalkan checkout" title="Batalkan checkout">${uiIcon('undo')}</button></div></div>`}).join(''):`<div class="card empty"><div class="big">🧾</div><b>Belum ada checkout</b><span>History belanja bulan ini akan muncul di sini.</span></div>`}`}
function renderShopReceipt(){const sessions=state.shoppingSessions.filter(s=>String(s.checkout_date||'').startsWith(state.month)).sort((a,b)=>new Date(b.created_at||b.checkout_date||0)-new Date(a.created_at||a.checkout_date||0));let selected=state.receiptSessionId?state.shoppingSessions.find(s=>s.id===state.receiptSessionId):null;if(selected&&String(selected.checkout_date||'').slice(0,7)!==state.month)selected=null;const header=`${shopTabs()}<div class="section-head" style="margin-top:2px"><div><div class="section-title">Receipt</div></div>${monthTrigger()}</div>`;if(selected){const items=state.shoppingItems.filter(i=>i.session_id===selected.id);return`${header}<button class="btn btn-soft" id="receiptBack" style="margin-bottom:10px">← Semua Receipt</button><div class="card receipt-card"><div class="receipt-top"><div><div class="receipt-store">${esc(selected.store_name||'Belanja Bulanan')}</div><div class="db-meta">${dateLabel(selected.checkout_date)} · ${esc(state.wallets.find(w=>w.id===selected.wallet_id)?.name||'Dompet')}</div></div><div class="receipt-total">${rupiah(selected.total_amount)}</div></div><div class="receipt-items">${items.map(i=>`<div class="receipt-line"><span>${esc(i.item_name)} · ${i.quantity} ${esc(i.uom||'pcs')}</span><b>${rupiah(i.subtotal)}</b></div>`).join('')}</div><div class="receipt-actions"><button class="icon-action danger" data-cancel-checkout="${selected.id}" aria-label="Batalkan checkout" title="Batalkan checkout">${uiIcon('undo')}</button></div></div>`}return`${header}${sessions.length?sessions.map(s=>{const items=state.shoppingItems.filter(i=>i.session_id===s.id);return`<button class="card receipt-index-card" data-view-receipt="${s.id}" style="display:block;width:100%;text-align:left;color:inherit;border:1px solid var(--line);margin-bottom:9px"><div class="receipt-top"><div><div class="receipt-store">${esc(s.store_name||'Belanja Bulanan')}</div><div class="db-meta">${dateLabel(s.checkout_date)} · ${items.length} item</div></div><div class="receipt-total">${rupiah(s.total_amount)}</div></div></button>`}).join(''):`<div class="card empty"><div class="big">🧾</div><b>Belum ada receipt</b><span>Receipt muncul otomatis setelah checkout.</span></div>`}`}
function filteredHistory(){let list=state.transactions.filter(t=>String(t.transaction_date||'').startsWith(state.month)).sort((a,b)=>new Date(b.created_at||b.transaction_date||0)-new Date(a.created_at||a.transaction_date||0));if(state.historyFilter==='income')list=list.filter(t=>t.transaction_type==='income');if(state.historyFilter==='expense')list=list.filter(t=>t.transaction_type==='expense'&&t.source_type!=='shopping');if(state.historyFilter==='shopping')list=list.filter(t=>t.source_type==='shopping');if(state.historyFilter==='transfer')list=list.filter(t=>t.transaction_type==='transfer');return list}
function historyGroupKey(t){if(state.historyGroup==='category')return state.categories.find(c=>c.id===t.category_id)?.name||(t.transaction_type==='transfer'?'Transfer':'Lainnya');if(state.historyGroup==='wallet')return state.wallets.find(w=>w.id===t.wallet_id)?.name||'Tanpa Dompet';return dateLabel(t.transaction_date)}

async function handleDeleteInvestment(id,confirmed=false){if(!state.online)return toast('Internet diperlukan.');const i=state.investments.find(x=>x.id===id);if(!i)return;if(!confirmed){askConfirm('deleteInvestment',id,'Hapus investasi?',`\"${i.name}\" akan dihapus. Jika investasi dibeli dari dompet, nominal pembelian awal akan dikembalikan otomatis.`,'HAPUS');return}state.loading=true;const purchaseTx=state.transactions.find(t=>t.source_type==='investment'&&t.source_id===id&&t.transaction_type==='investment_buy');const {error}=await sb.rpc('finance_delete_investment',{p_household_id:state.household.id,p_investment_id:id});state.loading=false;if(error)return toast(error.message||'Gagal menghapus investasi.');state.optimisticDeletedInvestmentIds=[...new Set([...state.optimisticDeletedInvestmentIds,id])];state.investments=state.investments.filter(x=>x.id!==id);if(purchaseTx){state.transactions=state.transactions.filter(t=>t.id!==purchaseTx.id);state.wallets=state.wallets.map(w=>w.id===purchaseTx.wallet_id?{...w,balance:Number(w.balance||0)+Number(purchaseTx.amount||0)}:w)}const liquid=state.wallets.reduce((a,w)=>a+Number(w.balance||0),0),investmentCost=state.investments.reduce((a,x)=>a+Number(x.invested_amount||0),0),investmentValue=state.investments.reduce((a,x)=>a+Number(x.current_value||0),0),assetValue=state.assets.reduce((a,x)=>a+Number(x.current_value||0),0);state.wealthSummary={liquid_balance:liquid,investment_cost:investmentCost,investment_value:investmentValue,investment_gain_loss:investmentValue-investmentCost,asset_value:assetValue,total_wealth:liquid+investmentValue+assetValue};persistCaches();render();toast('Investasi dihapus.');setTimeout(()=>{if(state.online)loadAll({preserveCacheOnEmpty:true}).catch(console.error)},1200)}

async function handleTxSubmit(e){e.preventDefault();if(state.loading||!state.online)return;state.loading=true;const form=e.currentTarget,submitBtn=form.querySelector('button[type="submit"]');if(submitBtn)submitBtn.disabled=true;const type=form.dataset.type,clientId=form.dataset.clientid||state.txClientId||makeId(),amount=num(document.getElementById('txAmount').value);if(amount<=0){state.loading=false;if(submitBtn)submitBtn.disabled=false;return toast('Nominal harus lebih dari 0.')}const wallet=document.getElementById('txWallet').value,desc=document.getElementById('txDescription').value.trim(),date=document.getElementById('txDate').value||today();let fn,args;if(type==='transfer'){const dest=document.getElementById('txDestination').value;if(wallet===dest){state.loading=false;if(submitBtn)submitBtn.disabled=false;return toast('Dompet asal dan tujuan harus berbeda.')}fn='finance_transfer_v2';args={p_household_id:state.household.id,p_source_wallet_id:wallet,p_destination_wallet_id:dest,p_amount:amount,p_description:desc||null,p_transaction_date:date,p_client_transaction_id:clientId}}else{const cat=document.getElementById('txCategory').value||null;fn=type==='income'?'finance_add_income_v2':'finance_add_expense_v2';args={p_household_id:state.household.id,p_wallet_id:wallet,p_amount:amount,p_category_id:cat,p_description:desc||null,p_transaction_date:date,p_client_transaction_id:clientId}}const {error}=await sb.rpc(fn,args);state.loading=false;if(error){if(submitBtn)submitBtn.disabled=false;return toast(error.message||'Transaksi gagal.')}state.modal=null;state.txClientId=null;await loadAll({rerender:false,preserveCacheOnEmpty:true});render();playCashRegister();toast(type==='transfer'?'Transfer berhasil.':'Transaksi disimpan.')}

async function handleCheckoutSubmit(e){e.preventDefault();if(state.loading||!state.online)return;const item=state.checklist.find(x=>String(x.id)===e.currentTarget.dataset.itemid);if(!item)return;const qty=Math.max(.01,parseFloat(document.getElementById('checkoutQty').value)||1),uom=normalizeUom(document.getElementById('checkoutUom').value||'Pcs'),price=num(document.getElementById('checkoutPrice').value),store=normalizeStoreName(document.getElementById('checkoutStore').value),wallet=document.getElementById('checkoutWallet').value,total=Math.round(qty*price);if(price<=0)return toast('Harga wajib diisi.');if(!wallet)return toast('Pilih dompet.');const clientId=item.clientCheckoutId||makeId();if(!item.clientCheckoutId){state.checklist=state.checklist.map(x=>String(x.id)===String(item.id)?{...x,clientCheckoutId:clientId}:x);persistCaches()}state.loading=true;const {data,error}=await sb.rpc('finance_complete_checkout_v2',{p_household_id:state.household.id,p_wallet_id:wallet,p_total_amount:total,p_items:[{name:item.name,quantity:qty,uom,unit_price:price,subtotal:total}],p_client_checkout_id:clientId,p_store_name:store||null,p_checkout_date:today()});if(error){state.loading=false;console.error(error);return toast(error.message||'Checkout gagal.')}const row=Array.isArray(data)?data[0]:data,sessionId=row?.session_id||null,now=new Date().toISOString(),cat=shoppingCategoryFor(item.name,item.category);state.checklist=state.checklist.map(x=>String(x.id)===String(item.id)?{...x,category:cat,purchased:true,purchasedAt:now,shoppingSessionId:sessionId,clientCheckoutId:clientId}:x);state.itemDb={...state.itemDb,[item.normalized]:{...(state.itemDb[item.normalized]||{}),name:item.name,normalized:item.normalized,category:cat,lastPrice:price,lastStore:store,uom,lastPurchased:now}};state.legacyHistory=[{id:makeId(),date:now,justDate:today(),itemId:item.normalized,name:item.name,category:cat,qty,uom,price,total,store,shoppingSessionId:sessionId,clientCheckoutId:clientId},...state.legacyHistory];try{await Promise.all([updateBucket('checklist',state.checklist),updateBucket('database',state.itemDb),updateBucket('history',state.legacyHistory)])}catch(syncErr){console.error(syncErr);toast('Transaksi tercatat, data belanja perlu disegarkan.')}state.loading=false;state.modal=null;localStorage.setItem('cn_last_checkout_wallet',wallet);persistCaches();await loadAll({rerender:false,preserveCacheOnEmpty:true});render();playCashRegister();toast(`Checkout ${rupiah(total)} berhasil.`)}

async function handleWalletEditSubmit(e){e.preventDefault();if(state.loading||!state.online)return;const form=e.currentTarget,id=form.dataset.id,name=document.getElementById('walletEditName').value.trim(),type=document.getElementById('walletEditType').value,newBalance=num(document.getElementById('walletEditBalance').value),oldBalance=Number(form.dataset.oldBalance||0);if(!name)return toast('Nama dompet wajib diisi.');state.loading=true;let error;if(newBalance!==oldBalance){const res=await sb.rpc('finance_update_wallet_v2',{p_household_id:state.household.id,p_wallet_id:id,p_name:name,p_wallet_type:type,p_new_balance:newBalance,p_client_transaction_id:makeId()});error=res.error}else{const res=await sb.rpc('finance_update_wallet',{p_household_id:state.household.id,p_wallet_id:id,p_name:name,p_wallet_type:type});error=res.error}state.loading=false;if(error)return toast(error.message||'Gagal mengedit dompet.');state.modal=null;await loadAll({rerender:false,preserveCacheOnEmpty:true});render();toast(newBalance!==oldBalance?'Dompet & saldo dikoreksi.':'Dompet diperbarui.')}
async function handleDeleteWallet(id,confirmed=false){if(!state.online)return toast('Internet diperlukan.');const w=state.wallets.find(x=>x.id===id);if(!w)return;if(!confirmed){askConfirm('deleteWallet',id,'Hapus dompet?',`\"${w.name}\" akan dihapus jika tidak memiliki history finansial. Dompet yang sudah dipakai transaksi akan ditolak otomatis.`,'HAPUS');return}state.loading=true;const {error}=await sb.rpc('finance_delete_wallet',{p_household_id:state.household.id,p_wallet_id:id});state.loading=false;if(error)return toast(error.message||'Dompet tidak bisa dihapus.');await loadAll({rerender:false,preserveCacheOnEmpty:true});render();toast('Dompet dihapus aman.')}
async function handleUndoTransaction(id,confirmed=false){if(!state.online)return toast('Internet diperlukan.');const t=state.transactions.find(x=>x.id===id);if(!t)return;if(!confirmed){askConfirm('undoTransaction',id,'Batalkan transaksi?',`${txLabel(t.transaction_type)} ${rupiah(t.amount)} akan dibatalkan dan saldo dikembalikan otomatis.`,'BATALKAN');return}state.loading=true;const {error}=await sb.rpc('finance_undo_transaction',{p_household_id:state.household.id,p_transaction_id:id});state.loading=false;if(error)return toast(error.message||'Undo gagal.');await loadAll({rerender:false,preserveCacheOnEmpty:true});render();toast('Transaksi dibatalkan.')}
async function handleTxEditSubmit(e){e.preventDefault();if(state.loading||!state.online)return;const id=e.currentTarget.dataset.id,amount=num(document.getElementById('txEditAmount').value),wallet=document.getElementById('txEditWallet').value,cat=document.getElementById('txEditCategory').value||null,desc=document.getElementById('txEditDescription').value.trim(),date=document.getElementById('txEditDate').value||today();if(amount<=0)return toast('Nominal harus lebih dari 0.');state.loading=true;const {error}=await sb.rpc('finance_update_transaction',{p_household_id:state.household.id,p_transaction_id:id,p_wallet_id:wallet,p_amount:amount,p_category_id:cat,p_description:desc||null,p_transaction_date:date});state.loading=false;if(error)return toast(error.message||'Edit transaksi gagal.');state.modal=null;await loadAll({rerender:false,preserveCacheOnEmpty:true});render();toast('Transaksi diperbarui.')}
async function handleCancelCheckout(sessionId,confirmed=false){if(!state.online)return toast('Internet diperlukan.');const sess=state.shoppingSessions.find(x=>x.id===sessionId);if(!sess)return;if(!confirmed){askConfirm('cancelCheckout',sessionId,'Batalkan checkout?',`${rupiah(sess.total_amount)} akan dibatalkan. Saldo dompet dan pemakaian anggaran dikembalikan otomatis.`,'BATALKAN CHECKOUT');return}state.loading=true;const {error}=await sb.rpc('finance_cancel_checkout',{p_household_id:state.household.id,p_session_id:sessionId});if(error){state.loading=false;return toast(error.message||'Gagal membatalkan checkout.')}state.checklist=state.checklist.map(x=>x.shoppingSessionId===sessionId?{...x,purchased:false,purchasedAt:null,shoppingSessionId:null,clientCheckoutId:null}:x);state.legacyHistory=state.legacyHistory.filter(x=>x.shoppingSessionId!==sessionId);try{await Promise.all([updateBucket('checklist',state.checklist),updateBucket('history',state.legacyHistory)])}catch(e){console.error(e)}state.loading=false;persistCaches();await loadAll({rerender:false,preserveCacheOnEmpty:true});render();toast('Checkout dibatalkan. Saldo & budget dipulihkan.')}
async function handleDeleteDbItem(payload,confirmed=false){const key=String(payload?.key||''),name=String(payload?.name||state.itemDb[key]?.name||'').trim();if(!key||!state.itemDb[key])return;if(!confirmed){askConfirm('deleteDbItem',{key,name},'Hapus data barang?',`Data harga ${name||'barang ini'} akan dihapus. Riwayat transaksi dan receipt tetap aman.`,'HAPUS');return}const next={...state.itemDb};delete next[key];state.itemDb=next;persistCaches();render();try{if(state.online&&name){const r=await sb.rpc('shopping_delete_item_profile',{p_household_id:state.household.id,p_item_name:name});if(r.error)console.warn('Profile delete',r.error)}await updateBucket('database',state.itemDb);toast('Data barang dihapus.')}catch(e){console.error(e);toast('Data dihapus di perangkat. Sync akan dicoba lagi.')}}
async function handleShopCategorySubmit(e){e.preventDefault();if(state.loading||!state.online)return;const itemId=e.currentTarget.dataset.itemid,name=e.currentTarget.dataset.name,categoryId=document.getElementById('shopCategorySelect').value,priority=normalizeShoppingPriority(document.getElementById('shopPrioritySelect')?.value||''),uom=normalizeUom(document.getElementById('shopCategoryUom').value||'Pcs');if(!categoryId)return toast('PILIH KATEGORI.');if(!priority)return toast('PILIH PRIORITAS.');state.loading=true;const profileRes=await sb.rpc('shopping_set_item_profile',{p_household_id:state.household.id,p_item_name:name,p_category_id:categoryId,p_preferred_uom:uom});if(profileRes.error){state.loading=false;return toast(profileRes.error.message||'GAGAL MENYIMPAN PROFIL BARANG.')}const priorityRes=await sb.rpc('shopping_set_item_priority',{p_household_id:state.household.id,p_item_name:name,p_priority:priority});state.loading=false;if(priorityRes.error)return toast(priorityRes.error.message||'GAGAL MENYIMPAN PRIORITAS.');const cat=state.shoppingCategories.find(c=>c.id===categoryId)?.name||'Lainnya',norm=normalizeItemName(name).toLowerCase();if(itemId)state.checklist=state.checklist.map(x=>String(x.id)===String(itemId)?{...x,category:cat,priority}:x);if(state.itemDb[norm])state.itemDb={...state.itemDb,[norm]:{...state.itemDb[norm],category:cat,priority,uom:uom||state.itemDb[norm].uom}};try{await Promise.all([updateBucket('checklist',state.checklist),updateBucket('database',state.itemDb)])}catch(err){console.error(err)}const returnKey=shopEditReturnKey;shopEditReturnKey=null;state.modal=null;await loadAll({rerender:false,preserveCacheOnEmpty:true});if(returnKey&&state.itemDb[returnKey])state.modal='dbdetail:'+encodeURIComponent(returnKey);render();toast('PROFIL BARANG DISIMPAN.')}
function backupData(){const payload={app:'CN MONEY',exportedAt:new Date().toISOString(),household:{id:state.household?.id,name:state.household?.name},wallets:state.wallets,categories:state.categories,transactions:state.transactions,investments:state.investments,assets:state.assets,wealthSummary:state.wealthSummary,budgetSummary:state.budgetSummary,shopping:{checklist:state.checklist,database:state.itemDb,legacyHistory:state.legacyHistory,sessions:state.shoppingSessions,items:state.shoppingItems,categories:state.shoppingCategories,profiles:state.shoppingProfiles}};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/octet-stream'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`CN-MONEY-backup-${today()}.cnmoney`;a.click();setTimeout(()=>URL.revokeObjectURL(url),500);toast('Backup berhasil disimpan.')}
let shopEditReturnKey=null;
let startupSyncing=true,reconnectPromise=null;
async function recoverOnline(){if(reconnectPromise)return reconnectPromise;reconnectPromise=(async()=>{state.online=true;try{await ensureSession();if(!state.household)restoreHouseholdFromLocal();if(state.household){await restoreHousehold();await loadAll({rerender:false,preserveCacheOnEmpty:true});subscribeRealtime();persistCaches()}render()}catch(err){console.error('Reconnect failed',err);render();toast('Belum bisa sync. Data lokal tetap aman.')}})();try{return await reconnectPromise}finally{reconnectPromise=null}}
window.addEventListener('online',()=>{if(!startupSyncing)recoverOnline()});window.addEventListener('offline',()=>{state.online=false;render()});window.addEventListener('pageshow',()=>{if(!startupSyncing&&state.household&&navigator.onLine)recoverOnline()});document.addEventListener('visibilitychange',()=>{if(!startupSyncing&&document.visibilityState==='visible'&&state.household&&navigator.onLine)recoverOnline()});
history.replaceState({finRoot:true},'');history.pushState({finGuard:true},'');window.addEventListener('popstate',()=>{const now=Date.now();if(refs.modal){state.modal=null;state.confirmation=null;state.txClientId=null;render();history.pushState({finGuard:true},'');return}if(refs.tab!=='dashboard'){state.tab='dashboard';render();history.pushState({finGuard:true},'');return}if(now-refs.lastBack<1600){history.go(-1);return}refs.lastBack=now;toast('Tekan kembali sekali lagi untuk keluar.');history.pushState({finGuard:true},'')});
async function seedMissingCategories(){if(!state.household?.id||!navigator.onLine)return;const jobs=[];if(!state.categories.length)jobs.push(sb.rpc('finance_seed_categories',{p_household_id:state.household.id}));if(!state.shoppingCategories.length)jobs.push(sb.rpc('shopping_seed_categories',{p_household_id:state.household.id}));if(!jobs.length)return;const results=await Promise.all(jobs);const err=results.find(x=>x?.error)?.error;if(err)throw err;await loadAll({rerender:false,preserveCacheOnEmpty:true})}
async function boot(){const hasLocal=restoreHouseholdFromLocal();if(hasLocal){hydrateCaches();state.ready=true;render()}if(!navigator.onLine){state.online=false;if(!hasLocal){state.ready=true;render()}startupSyncing=false;return}try{await ensureSession();const restored=await restoreHousehold();if(restored){hydrateCaches();await loadAll({rerender:false,preserveCacheOnEmpty:true});await seedMissingCategories();subscribeRealtime();persistCaches()}state.ready=true;render()}catch(err){console.error(err);state.ready=true;if(hasLocal||restoreHouseholdFromLocal()){hydrateCaches();render();toast('Cloud tidak terjangkau. Membuka data terakhir di perangkat.')}else{renderOnboarding(err?.message||'Gagal memulai aplikasi.')}}finally{startupSyncing=false}}
if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/service-worker.js').catch(console.warn))}boot();
})();
