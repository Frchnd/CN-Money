function renderShopHistory(){const sessions=state.shoppingSessions.filter(s=>String(s.checkout_date||'').startsWith(state.month));return`${shopTabs()}<div class="section-head" style="margin-top:2px"><div><div class="section-title">History Belanja</div></div><input id="monthPicker" class="month-input" type="month" value="${esc(state.month)}"></div>${sessions.length?sessions.map(s=>{const items=state.shoppingItems.filter(i=>i.session_id===s.id);return`<div class="card receipt-card"><div class="receipt-top"><div><div class="receipt-store">${esc(s.store_name||'Belanja Bulanan')}</div><div class="db-meta">${dateLabel(s.checkout_date)} · ${items.length} item · ${esc(state.wallets.find(w=>w.id===s.wallet_id)?.name||'Dompet')}</div></div><div class="receipt-total">${rupiah(s.total_amount)}</div></div><div class="receipt-actions"><button class="icon-action primary" data-view-receipt="${s.id}" aria-label="Lihat receipt" title="Lihat receipt">${uiIcon('receipt')}</button><button class="icon-action danger" data-cancel-checkout="${s.id}" aria-label="Batalkan checkout" title="Batalkan checkout">${uiIcon('undo')}</button></div></div>`}).join(''):`<div class="card empty"><div class="big">🧾</div><b>Belum ada checkout</b><span>History belanja bulan ini akan muncul di sini.</span></div>`}`}
function renderShopReceipt(){const sessions=state.shoppingSessions.filter(s=>String(s.checkout_date||'').startsWith(state.month));let selected=state.receiptSessionId?state.shoppingSessions.find(s=>s.id===state.receiptSessionId):null;if(selected&&String(selected.checkout_date||'').slice(0,7)!==state.month)selected=null;const header=`${shopTabs()}<div class="section-head" style="margin-top:2px"><div><div class="section-title">Receipt</div></div><input id="monthPicker" class="month-input" type="month" value="${esc(state.month)}"></div>`;if(selected){const items=state.shoppingItems.filter(i=>i.session_id===selected.id);return`${header}<button class="btn btn-soft" id="receiptBack" style="margin-bottom:10px">← Semua Receipt</button><div class="card receipt-card"><div class="receipt-top"><div><div class="receipt-store">${esc(selected.store_name||'Belanja Bulanan')}</div><div class="db-meta">${dateLabel(selected.checkout_date)} · ${esc(state.wallets.find(w=>w.id===selected.wallet_id)?.name||'Dompet')}</div></div><div class="receipt-total">${rupiah(selected.total_amount)}</div></div><div class="receipt-items">${items.map(i=>`<div class="receipt-line"><span>${esc(i.item_name)} · ${i.quantity} ${esc(i.uom||'pcs')}</span><b>${rupiah(i.subtotal)}</b></div>`).join('')}</div><div class="receipt-actions"><button class="icon-action danger" data-cancel-checkout="${selected.id}" aria-label="Batalkan checkout" title="Batalkan checkout">${uiIcon('undo')}</button></div></div>`}return`${header}${sessions.length?sessions.map(s=>{const items=state.shoppingItems.filter(i=>i.session_id===s.id);return`<button class="card receipt-card" data-view-receipt="${s.id}" style="display:block;width:100%;text-align:left;color:inherit;border:1px solid var(--line);margin-bottom:9px"><div class="receipt-top"><div><div class="receipt-store">${esc(s.store_name||'Belanja Bulanan')}</div><div class="db-meta">${dateLabel(s.checkout_date)} · ${items.length} item</div></div><div class="receipt-total">${rupiah(s.to function filteredHistory(){let list=state.transactions.filter(t=>String(t.transaction_date||'').startsWith(state.month));if(state.historyFilter==='income')list=list.filter(t=>t.transaction_type==='income');if(state.historyFilter==='expense')list=list.filter(t=>t.transaction_type==='expense'&&t.source_type!=='shopping');if(state.historyFilter==='shopping')list=list.filter(t=>t.source_type==='shopping');if(state.historyFilter==='transfer')list=list.filter(t=>t.transaction_type==='transfer');return list}

document.getElementById('themeSelect')?.addEventListener('change',e=>{localStorage.setItem('fin_theme',e.target.value);applyTheme();render()});document.getElementById('soundSelect')?.addEventListener('change',e=>{localStorage.setItem('cn_sound',e.target.value==='off'?'off':'on');if(e.target.value==='on')playShopClick();});document.getElementById('backupBtn')?.addEventListener('click',backupData);document.getElementById('clearDeviceBtn')?.addEventListener('click',()=>askConfirm('clearDevice',null,'Hapus data perangkat ini?','Perangkat ini akan keluar dari CN MONEY. Data di perangkat lain tidak dihapus.','HAPUS DARI PERANGKAT'));document.querySelector('[data-confirm-cancel]')?.addEventListener('click',()=>{state.confirmation=null;render()});document.querySelector('[data-confirm-ok]')?.addEventListener('click',async()=>{const c=state.confirmation;if(!c)return;state.confirmation=null;render();if(c.action==='deleteWallet')return handleDeleteWallet(c.payload,true);if(c.action==='deleteInvestment')return handleDeleteInvestment(c.payload,true);if(c.action==='deleteAsset')return handleDeleteAsset(c.payload,true);if(c.action==='deleteDbItem')return handleDeleteDbItem(c.payload,true);if(c.action==='undoTransaction')return handleUndoTransaction(c.payload,true);if(c.action==='cancelCheckout')return handleCancelCheckout(c.payload,true);if(c.action==='clearDevice'){forgetHousehold();state.wallets=[];state.categories=[];state.transactions=[];state.investments=[];state.assets=[];state.checklist=[];state.itemDb={};state.shoppingSessions=[];state.shoppingItems=[];state.modal=null;render()}})}

async function handleDeleteInvestment(id,confirmed=false){if(!state.online)return toast('Internet diperlukan.');const i=state.investments.find(x=>x.id===id);if(!i)return;if(!confirmed){askConfirm('deleteInvestment',id,'Hapus investasi?',`\"${i.name}\" akan dihapus. Jika investasi dibeli dari dompet, nominal pembelian awal akan dikembalikan otomatis.`,'HAPUS');return}state.loading=true;const purchaseTx=state.transactions.find(t=>t.source_type==='investment'&&t.source_id===id&&t.transaction_type==='investment_buy');const {error}=await sb.rpc('finance_delete_investment',{p_household_id:state.household.id,p_investment_id:id});state.loading=false;if(error)return toast(error.message||'Gagal menghapus investasi.');state.optimisticDeletedInvestmentIds=[...new Set([...state.optimisticDeletedInvestmentIds,id])];state.investments=state.investments.filter(x=>x.id!==id);if(purchaseTx){state.transactions=state.transactions.filter(t=>t.id!==purchaseTx.id);state.wallets=state.wallets.map(w=>w.id===purchaseTx.wallet_id?{...w,balance:Number(w.balance||0)+Number(purchaseTx.amount||0)}:w)}const liquid=state.wallets.reduce((a,w)=>a+Number(w.balance||0),0),investmentCost=state.investments.reduce((a,x)=>a+Number(x.invested_amount||0),0),investmentValue=state.investments.reduce((a,x)=>a+Number(x.current_value||0),0),assetValue=state.assets.reduce((a,x)=>a+Number(x.current_value||0),0);state.wealthSummary={liquid_balance:liquid,investment_cost:investmentCost,investment_value:investmentValue,investment_gain_loss:investmentValue-investmentCost,asset_value:assetValue,total_wealth:liquid+investmentValue+assetValue};persistCaches();render();toast('Investasi dihapus.');setTimeout(()=>{if(state.online)loadAll({preserveCacheOnEmpty:true}).catch(console.error)},1200)}

async function handleTxSubmit(e){e.preventDefault();if(state.loading||!state.online)return;state.loading=true;const form=e.currentTarget,submitBtn=form.querySelector('button[type="submit"]');if(submitBtn)submitBtn.disabled=true;const type=form.dataset.type,clientId=form.dataset.clientid||state.txClientId||makeId(),amount=num(document.getElementById('txAmount').value);if(amount<=0){state.loading=false;if(submitBtn)submitBtn.disabled=false;return toast('Nominal harus lebih dari 0.')}const wallet=document.getElementById('txWallet').value,desc=document.getElementById('txDescription').value.trim(),date=document.getElementById('txDate').value||today();let fn,args;if(type==='transfer'){const dest=document.getElementById('txDestination').value;if(wallet===dest){state.loading=false;if(submitBtn)submitBtn.disabled=false;return toast('Dompet asal dan tujuan harus berbeda.')}fn='finance_transfer_v2';args={p_household_id:state.household.id,p_source_wallet_id:wallet,p_destination_wallet_id:dest,p_amount:amount,p_description:desc||null,p_transaction_date:date,p_client_transaction_id:clientId}}else{const cat=document.getElementById('txCategory').value||null;fn=type==='income'?'finance_add_income_v2':'finance_add_expense_v2';args={p_household_id:state.household.id,p_wallet_id:wallet,p_amount:amount,p_category_id:cat,p_description:desc||null,p_transaction_date:date,p_client_transaction_id:clientId}}const {error}=await sb.rpc(fn,args);state.loading=false;if(error){if(submitBtn)submitBtn.disabled=false;return toast(error.message||'Transaksi gagal.')}state.modal=null;state.txClientId=null;await loadAll({rerender:false,preserveCacheOnEmpty:true});render();playCashRegister();toast(type==='transfer'?'Transfer berhasil.':'Transaksi disimpan.')}

async function handleCheckoutSubmit(e){e.preventDefault();if(state.loading||!state.online)return;const item=state.checklist.find(x=>String(x.id)===e.currentTarget.dataset.itemid);if(!item)return;const qty=Math.max(.01,parseFloat(document.getElementById('checkoutQty').value)||1),uom=normalizeUom(document.getElementById('checkoutUom').value||'Pcs'),price=num(document.getElementById('checkoutPrice').value),store=normalizeStoreName(document.getElementById('checkoutStore').value),wallet=document.getElementById('checkoutWallet').value,total=Math.round(qty*price);if(price<=0)return toast('Harga wajib diisi.');if(!wallet)return toast('Pilih dompet.');const clientId=item.clientCheckoutId||makeId();if(!item.clientCheckoutId){state.checklist=state.checklist.map(x=>String(x.id)===String(item.id)?{...x,clientCheckoutId:clientId}:x);persistCaches()}state.loading=true;const {data,error}=await sb.rpc('finance_complete_checkout_v2',{p_household_id:state.household.id,p_wallet_id:wallet,p_total_amount:total,p_items:[{name:item.name,quantity:qty,uom,unit_price:price,subtotal:total}],p_client_checkout_id:clientId,p_store_name:store||null,p_checkout_date:today()});if(error){state.loading=false;console.error(error);return toast(error.message||'Checkout gagal.')}const row=Array.isArray(data)?data[0]:data,sessionId=row?.session_id||null,now=new Date().toISOString(),cat=shoppingCategoryFor(item.name,item.category);state.checklist=state.checklist.map(x=>String(x.id)===String(item.id)?{...x,category:cat,purchased:true,purchasedAt:now,shoppingSessionId:sessionId,clientCheckoutId:clientId}:x);state.itemDb={...state.itemDb,[item.normalized]:{...(state.itemDb[item.normalized]||{}),name:item.name,normalized:item.normalized,category:cat,lastPrice:price,lastStore:store,uom,lastPurchased:now}};state.legacyHistory=[{id:makeId(),date:now,justDate:today(),itemId:item.normalized,name:item.name,category:cat,qty,uom,price,total,store,shoppingSessionId:sessionId,clientCheckoutId:clientId},...state.legacyHist async function handleUndoTransaction(id,confirmed=false){if(!state.online)return toast('Internet diperlukan.');const t=state.transactions.find(x=>x.id===id);if(!t)return;if(!confirmed){askConfirm('undoTransaction',id,'Batalkan transaksi?',`${txLabel(t.transaction_type)} ${rupiah(t.amount)} akan dibatalkan dan saldo dikembalikan otomatis.`,'BATALKAN');return}state.loading=true;const {error}=await sb.rpc('finance_undo_transaction',{p_household_id:state.household.id,p_transaction_id:id});state.loading=false;if(error)return toast(error.message||'Undo gagal.');await loadAll({rerender:false,preserveCacheOnEmpty:true});render();toast('Transaksi dibatalkan.')}

async function handleShopCategorySubmit(e){e.preventDefault();if(state.loading||!state.online)return;const itemId=e.currentTarget.dataset.itemid,name=e.currentTarget.dataset.name,categoryId=document.getElementById('shopCategorySelect').value,uom=normalizeUom(document.getElementById('shopCategoryUom').value||'Pcs');if(!categoryId)return toast('Pilih kategori.');state.loading=true;const {error}=await sb.rpc('shopping_set_item_profile',{p_household_id:state.household.id,p_item_name:name,p_category_id:categoryId,p_preferred_uom:uom});state.loading=false;if(error)return toast(error.message||'Gagal menyimpan kategori.');const cat=state.shoppingCategories.find(c=>c.id===categoryId)?.name||'Lainnya',norm=String(name).toLowerCase();if(itemId)state.checklist=state.checklist.map(x=>String(x.id)===String(itemId)?{...x,category:cat}:x);if(state.itemDb[norm])state.itemDb={...state.itemDb,[norm]:{...state.itemDb[norm],category:cat,uom:uom||state.itemDb[norm].uom}};try{await Promise.all([updateBucket('checklist',state.checklist),updateBucket('database',state.itemDb)])}catch(e){console.error(e)}state.modal=null;await loadAll({rerender:false,preserveCacheOnEmpty:true});render();toast('Kategori barang disimpan.')}
function backupData(){const payload={app:'CN MONEY',exportedAt:new Date().toISOString(),household:{id:state.household?.id,name:state.household?.name},wallets:state.wallets,categories:state.categories,transactions:state.transactions,investments:state.investments,assets:state.assets,wealthSummary:state.wealthSummary,budgetSummary:state.budgetSummary,shopping:{checklist:state.checklist,database:state.itemDb,legacyHistory:state.legacyHistory,sessions:state.shoppingSessions,items:state.shoppingItems,categories:state.shoppingCategories,profiles:state.shoppingProfiles}};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/octet-stream'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`CN-MONEY-backup-${today()}.cnmoney`;a.click();setTimeout(()=>URL.revokeObjectURL(url),500);toast('Backup berhasil disimpan.')}
async function recoverOnline(){state.online=true;try{await ensureSession();if(!state.household)restoreHouseholdFromLocal();if(state.household){await restoreHousehold();await loadAll({rerender:false,preserveCacheOnEmpty:true});subscribeRealtime();persistCaches()}render()}catch(err){console.error('Reconnect failed',err);render();toast('Belum bisa sync. Data lokal tetap aman.')}}
window.addEventListener('online',recoverOnline);window.addEventListener('offline',()=>{state.online=false;render()});window.addEventListener('pageshow',()=>{if(state.household&&navigator.onLine)recoverOnline()});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&state.household&&navigator.onLine)recoverOnline()});
history.replaceState({finRoot:true},'');history.pushState({finGuard:true},'');window.addEventListener('popstate',()=>{const now=Date.now();if(refs.modal){state.modal=null;state.confirmation=null;state.txClientId=null;render();history.pushState({finGuard:true},'');return}if(refs.tab!=='dashboard'){state.tab='dashboard';render();history.pushState({finGuard:true},'');return}if(now-refs.lastBack<1600){history.go(-1);return}refs.lastBack=now;toast('Tekan kembali sekali lagi untuk keluar.');history.pushState({finGuard:true},'')});
async function boot(){const hasLocal=restoreHouseholdFromLocal();if(hasLocal)hydrateCaches();if(!navigator.onLine){state.online=false;state.ready=true;render();return}try{await ensureSession();const restored=await restoreHousehold();if(restored){hydrateCaches();const [seed,shopSeed]=await Promise.all([sb.rpc('finance_seed_categories',{p_household_id:state.household.id}),sb.rpc('shopping_seed_categories',{p_household_id:state.household.id})]);if(seed.error)throw seed.error;if(shopSeed.error)throw shopSeed.error;await loadAll({rerender:false,preserveCacheOnEmpty:true});await wait(250);await loadAll({rerender:false,preserveCacheOnEmpty:false});subscribeRealtime();persistCaches()}state.ready=true;render()}catch(err){console.error(err);state.ready=true;if(hasLocal||restoreHouseholdFromLocal()){hydrateCaches();render();toast('Cloud tidak terjangkau. Membuka data terakhir di perangkat.')}else{renderOnboarding(err?.message||'Gagal memulai aplikasi.')}}}
if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/service-worker.js').catch(console.warn))}boot();
